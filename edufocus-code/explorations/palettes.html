<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduFocus — trois palettes</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito Sans',system-ui,sans-serif;background:#E9E9E6;padding:18px;
  -webkit-font-smoothing:antialiased}
.intro{max-width:1180px;margin:0 auto 20px;font-size:14px;color:#333;line-height:1.6}
.intro h1{font-family:'Poppins',sans-serif;font-size:23px;margin-bottom:6px;letter-spacing:-.02em}
.grid{display:grid;gap:18px;max-width:1180px;margin:0 auto;
  grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}

.demo{--pers:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 16'%3E%3Ccircle cx='6' cy='3.3' r='3.05'/%3E%3Cpath d='M6 7.5c3.3 0 6 2.7 6 6V16H0v-2.5c0-3.3 2.7-6 6-6z'/%3E%3C/svg%3E");
  border-radius:12px;overflow:hidden;background:var(--sable);
  box-shadow:0 3px 14px rgba(0,0,0,.13);font-size:13px}

/* ── A · Émeraude ───────────────────────────────────────── */
.pA{--vert:#0A5C3D;--vert2:#0E7049;--vert0:#064027;--or:#EAA31A;--sable:#F5F2EC;
    --papier:#FFFFFF;--encre:#13201B;--gris:#6C766F;--trait:#E3DDD1;
    --p1:#C4382F;--p2:#E07B2E;--p3:#EAA31A;--p4:#3FA06C}
/* ── B · Pin & ardoise ──────────────────────────────────── */
.pB{--vert:#0D5137;--vert2:#116646;--vert0:#08381F;--or:#DDA01E;--sable:#F1F3F1;
    --papier:#FFFFFF;--encre:#131C18;--gris:#667069;--trait:#DDE2DD;
    --p1:#BE3A3A;--p2:#D9752F;--p3:#DDA01E;--p4:#3B9865}
/* ── C · Contraste clair ────────────────────────────────── */
.pC{--vert:#084C33;--vert2:#0C6242;--vert0:#05341F;--or:#E5A80F;--sable:#FAFAF7;
    --papier:#FFFFFF;--encre:#0E1A15;--gris:#707A74;--trait:#E6E6E0;
    --p1:#CE3B33;--p2:#E4842F;--p3:#E5A80F;--p4:#46A56F}

.tag{padding:9px 14px;font-family:'Poppins',sans-serif;font-size:12px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;background:#fff;color:#444;
  border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center}
.tag em{font-style:normal;font-weight:600;letter-spacing:0;text-transform:none;
  font-size:11px;color:#888;font-family:'Nunito Sans',sans-serif}

.hero{position:relative;text-align:center;padding:22px 18px 26px;color:#fff;
  background:radial-gradient(120% 90% at 50% 0%,var(--vert2) 0%,var(--vert) 58%,var(--vert0) 100%)}
.hero::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,var(--p4) 0 67%,var(--or) 67% 84%,var(--p1) 84% 100%)}
.kick{font-size:9px;font-weight:700;letter-spacing:.19em;text-transform:uppercase;
  color:rgba(255,255,255,.62);margin-bottom:9px}
.count{font-family:'Poppins',sans-serif;font-size:44px;font-weight:800;letter-spacing:-.05em;
  line-height:.92;text-shadow:0 2px 16px rgba(0,0,0,.22)}
.csub{font-size:11.5px;color:rgba(255,255,255,.88);margin-top:9px;line-height:1.45}

.body{padding:12px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.kpis div{background:var(--papier);border:1px solid var(--trait);border-radius:9px;
  padding:9px 5px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.kpis b{display:block;font-family:'Poppins',sans-serif;font-size:19px;font-weight:800;
  color:var(--vert);letter-spacing:-.035em}
.kpis i{display:block;font-style:normal;font-size:8.5px;color:var(--gris);margin-top:4px;
  line-height:1.3}

.tile{background:var(--papier);border:1px solid var(--trait);border-radius:9px;padding:12px;
  margin-top:9px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.lab{font-size:8.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--gris);margin-bottom:9px}
.waffle{display:grid;grid-template-columns:repeat(20,1fr);gap:2px 3px;max-width:100%}
.waffle i{display:block;aspect-ratio:12/16;background-color:var(--p4);
  -webkit-mask:var(--pers) center/contain no-repeat;mask:var(--pers) center/contain no-repeat}
.waffle i.m{background-color:var(--or)} .waffle i.n{background-color:var(--p1)}
.wkey{display:flex;gap:11px;margin-top:9px;font-size:9.5px;color:var(--gris);flex-wrap:wrap}
.wkey span{display:flex;align-items:center;gap:5px}
.wkey b{width:8px;height:11px;background-color:var(--p4);flex:none;
  -webkit-mask:var(--pers) center/contain no-repeat;mask:var(--pers) center/contain no-repeat}
.wkey .m b{background-color:var(--or)} .wkey .n b{background-color:var(--p1)}

.bars{display:grid;gap:4px}
.bar{display:grid;grid-template-columns:74px 1fr 34px;align-items:center;gap:7px;font-size:9.5px}
.bn{font-weight:700;color:var(--encre);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{height:12px;background:var(--trait);border-radius:3px;overflow:hidden}
.bt i{display:block;height:100%;border-radius:3px}
.bv{text-align:right;font-weight:700;color:var(--encre)}

.acc{background:linear-gradient(160deg,var(--vert2),var(--vert0));color:#fff;
  border-radius:9px;padding:12px;margin-top:9px}
.acc .lab{color:rgba(255,255,255,.7)}
.split{display:flex;height:30px;border-radius:5px;overflow:hidden;gap:2px}
.split div{display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}

.swatches{display:flex;gap:0;margin-top:11px;border-radius:7px;overflow:hidden;
  border:1px solid var(--trait)}
.swatches div{flex:1;height:34px;display:grid;place-items:end center;padding-bottom:3px;
  font-size:7.5px;font-weight:700;color:#fff;font-family:ui-monospace,monospace}
.note{font-size:10.5px;color:var(--gris);margin-top:9px;line-height:1.5}
</style>
</head>
<body>

<div class="intro">
  <h1>Trois palettes pour EduFocus</h1>
  Le vert et l'or du drapeau restent dans les trois. Ce qui change : la luminosité du vert,
  la chaleur du fond et la saturation des quatre couleurs de priorité.
  Comparez sur cet écran, puis dites-moi laquelle appliquer.
</div>

<div class="grid" id="grid"></div>

<script>
const P = [
  ['pA', 'A · Émeraude', 'vert plus vif, fond sable adouci',
   ['#0A5C3D vert', '#EAA31A or', '#F5F2EC fond', '#C4382F urgent', '#3FA06C faible'],
   ['#0A5C3D', '#EAA31A', '#C9C2B4', '#C4382F', '#3FA06C'],
   "Le plus proche de l'actuel. Le vert gagne en lumière, le fond perd son côté jauni. Choix sûr."],
  ['pB', 'B · Pin & ardoise', 'neutres froids, teintés de vert',
   ['#0D5137 vert', '#DDA01E or', '#F1F3F1 fond', '#BE3A3A urgent', '#3B9865 faible'],
   ['#0D5137', '#DDA01E', '#C3CCC5', '#BE3A3A', '#3B9865'],
   "Le fond quitte le beige pour un gris très légèrement vert. L'ensemble paraît plus net, plus contemporain."],
  ['pC', 'C · Contraste clair', 'fond presque blanc, couleurs franches',
   ['#084C33 vert', '#E5A80F or', '#FAFAF7 fond', '#CE3B33 urgent', '#46A56F faible'],
   ['#084C33', '#E5A80F', '#D8D8CE', '#CE3B33', '#46A56F'],
   "Fond quasi blanc : les données ressortent au maximum. Le plus lisible sur un vidéoprojecteur."]
];

const WAF = (() => {                       // 100 personnes : 67 / 17 / 16
  let h = '';
  for (let i = 0; i < 100; i++) h += `<i class="${i < 67 ? '' : i < 84 ? 'm' : 'n'}"></i>`;
  return h;
})();

const BARS = [['Nouakchott', 100, 'p1'], ['Hodh El Charghi', 90, 'p1'],
              ['Assaba', 73, 'p2'], ['Hodh El Gharbi', 66, 'p1'], ['Guidimakha', 63, 'p1']];
const VALS = ['65 995', '59 368', '48 134', '43 696', '41 469'];

document.getElementById('grid').innerHTML = P.map(([cls, titre, sous, noms, hex, note]) => `
<div class="demo ${cls}">
  <div class="tag">${titre}<em>${sous}</em></div>
  <div class="hero">
    <div class="kick">Mauritanie · enfants de 6 à 14 ans</div>
    <div class="count">365 231</div>
    <div class="csub">enfants de 6 à 14 ans ne sont jamais allés à l'école.</div>
  </div>
  <div class="body">
    <div class="kpis">
      <div><b>33,1 %</b><i>des enfants 6-14</i></div>
      <div><b>71 %</b><i>dans 5 wilayas</i></div>
      <div><b>47,2 %</b><i>le pire taux</i></div>
    </div>
    <div class="tile">
      <div class="lab">Sur 100 enfants de 6 à 14 ans</div>
      <div class="waffle">${WAF}</div>
      <div class="wkey">
        <span><b></b>67 à l'école</span>
        <span class="m"><b></b>17 mahadra</span>
        <span class="n"><b></b>16 nulle part</span>
      </div>
    </div>
    <div class="tile">
      <div class="lab">Les 5 plus gros besoins</div>
      <div class="bars">
        ${BARS.map(([n, w, c], i) => `<div class="bar"><span class="bn">${n}</span>
          <div class="bt"><i style="width:${w}%;background:var(--${c})"></i></div>
          <span class="bv">${VALS[i]}</span></div>`).join('')}
      </div>
    </div>
    <div class="acc">
      <div class="lab">Deux problèmes très différents</div>
      <div class="split">
        <div style="background:var(--or);flex:194">194 075</div>
        <div style="background:var(--p1);flex:171">171 103</div>
      </div>
    </div>
    <div class="swatches">${hex.map((h, i) =>
      `<div style="background:${h};color:${i === 2 ? '#333' : '#fff'}">${noms[i].split(' ')[0]}</div>`).join('')}
    </div>
    <p class="note">${note}</p>
  </div>
</div>`).join('');
</script>
</body>
</html>
