<ul>
<li><b>السكان حسب الولاية، 2013-2019</b> — قاعدة قدمتها إدارة الهاكاثون (IndabaX موريتانيا، نسخة 2026). تعطي <i>عدد</i> السكان.</li>
<li><b>المسح الدائم لظروف معيشة الأسر (EPCV 2019)</b> — الوكالة الوطنية للإحصاء والتحليل الديموغرافي والاقتصادي (ANSADE). المقتطف المستعمل: 60,600 فرد، 13 ولاية. تعطي <i>النسب</i>: من يذهب إلى المدرسة، من هو فقير، ولد أم بنت، مدينة أم ريف. هذه القاعدة ليست ضمن البيانات المقدمة: حصلنا عليها من ANSADE.</li>
</ul>
<p>تُربط القاعدتان بالولاية. نسبة مضروبة في عدد السكان تعطي عدداً حقيقياً. هذه هي المنهجية كلها: <b>نحوّل النسب المئوية إلى أطفال</b>.</p>

<h3>2. معنى «خارج المدرسة النظامية»</h3>
<p>يُحتسب الطفل من 6 إلى 14 سنة <b>خارج المدرسة النظامية</b> إذا لم يلتحق قط بمدرسة عمومية أو خصوصية معترف بها. ثم نفصل بين وضعيتين مختلفتين تماماً:</p>
<ul>
<li><b>المحظرة أو الكتّاب فقط</b> — الطفل يتعلم، لكن مساره لا يفضي إلى شهادة معترف بها. يحتاج إلى <i>جسر</i>.</li>
<li><b>لا تعليم إطلاقاً</b> — الطفل ليس في أي مكان. يحتاج إلى <i>مدرسة</i>.</li>
</ul>
<p>مجموعهما يعطي نسبة الخروج من المدرسة النظامية. هذا التمييز هو جوهر المشروع: ولايتان بنفس النسبة قد تكون مشكلتاهما متعاكستين.</p>

<h3>3. مؤشر الأولوية التعليمية</h3>
<div class="formula">
<code>index = 0.45 × volume + 0.35 × intensity + 0.20 × vulnerability</code><br>
volume = عدد الأطفال خارج المدرسة · intensity = نسبة الخروج · vulnerability = معدل الفقر<br>
كل عنصر يُعاد إلى سلّم من 0 إلى 100 بطريقة min-max على الولايات الثلاث عشرة:
<code>(x − min) / (max − min) × 100</code>
</div>
<p>الحجم له الوزن الأكبر لأن الميزانية تُنفق على أطفال لا على نسب. الشدة تصحّح أثر الحجم. الهشاشة تذكّر بأن الولاية الفقيرة تملك موارد ذاتية أقل. المؤشر بسيط <b>عن قصد</b>: يُشرح في 30 ثانية ويمكن لأي شخص إعادة حسابه.</p>

<h3>3 مكرر. لماذا 45 / 35 / 20 وليس أرقاماً أخرى؟</h3>
<p>هذا هو السؤال الذي ينبغي طرحه، والجواب الصادق يأتي في شقّين.</p>
<ul>
<li><b>الحجم 45 %</b> — وحده من بين الثلاثة يُترجَم مباشرة إلى قاعات ومدرّسين. الوزارة لا تبني من أجل نسبة مئوية. أعطيناه الوزن الأكبر دون أغلبية مطلقة: عند 50 % أو أكثر يتحوّل الترتيب إلى ترتيب حسب عدد السكان وتصبح نواكشوط الأولى، وهو ما لا معنى له من حيث الاستعجال.</li>
<li><b>الشدة 35 %</b> — بما يكفي لتصحيح أثر الحجم ومنع الولايات الصغيرة شديدة التأثر من الاختفاء خلف الكبيرة. إنها الثقل الموازن للحجم، وتكاد تعادله.</li>
<li><b>الهشاشة 20 %</b> — وزن أقلّي عن قصد. الفقر ليس مؤشراً مدرسياً: إنه يعدّل صعوبة التدخل ولا يقيس المشكلة. إعطاؤه أكثر يعني إنتاج ترتيب للفقر لا للتعليم.</li>
</ul>
<p><b>ما الذي يغيّره اختيار الأوزان فعلياً.</b> أعدنا حساب الترتيب لجميع <b>231 تركيبة ممكنة للأوزان</b> بخطوة 5 %، من 100/0/0 إلى 0/0/100:</p>
<div class="formula">
كيدي ماغة والحوض الغربي ولعصابة ضمن الخمس الأوائل <code>في 100 % من الحالات</code><br>
كيدي ماغة في المرتبة الأولى <code>في 67 % من الحالات</code><br>
الترارزة وإنشيري وداخلة نواذيبو وتيرس زمور وأدرار لا تدخل الخمس الأوائل <code>في أي حالة</code>
</div>
<p class="card warn" style="margin-top:10px"><b>ما يعنيه ذلك وما لا يعنيه.</b> الترتيب الدقيق <b>يتغيّر</b> مع الأوزان: ثلث التركيبات فقط يعطي نفس الخمس الأوائل تماماً، ويمكن للحوض الشرقي أن ينزل إلى المرتبة العاشرة إذا اعتُمدت الشدة وحدها. نحن لا ندّعي أن 45/35/20 هي الترجيح الوحيد القابل للدفاع عنه.<br><br>في المقابل، <b>مجموعة الولايات ذات الأولوية متينة</b>. ثلاث ولايات ضمن الخمس الأوائل مهما فعلنا، وخمس لا تدخلها أبداً. بعبارة أخرى: اختيار الأوزان يغيّر الترتيب لا القرار. صانع قرار يفضّل الشدة سيستثمر في المناطق نفسها، بترتيب مختلف.</p>
<p>ولهذا تُعرض المعادلة: ليست هناك لتُصدَّق، بل لتُعاد حسابها.</p>

<h3>4. الآلية</h3>
<ul>
<li><b>الإقصاء</b> — أغلبية الأطفال خارج المدرسة لا يتلقون أي تعليم. الحل: بناء المدارس.</li>
<li><b>الإحلال</b> — الأغلبية في المحظرة أو الكتّاب. الحل: الجسور والمعادلات.</li>
<li><b>الحجم المرتفع</b> — تمثل الولاية 15 % على الأقل من الحاجة الوطنية بينما تبقى نسبتها دون المعدل (33.1 %). المشكلة مشكلة حجم. الحل: الطاقة الاستيعابية.</li>
</ul>

<h3>5. المحاكي</h3>
<p>يجيب المحاكي عن سؤال التوزيع لا عن سؤال الميزانية. تحدّد <b>طاقة معبّراً عنها بالأطفال</b> — عدد الأطفال الذين يمكنك إدخالهم إلى المدرسة — ثم تختار قاعدة. تُظهر الأداة أين تذهب المقاعد وما يتبقى بعد ذلك.</p>
<ul>
<li><b>حسب العدد</b> — تحصل كل ولاية على حصة تتناسب مع عدد أطفالها خارج المدرسة.</li>
<li><b>الأكثر استعجالاً أولاً</b> — نتبع ترتيب المؤشر ونعالج كل ولاية بالكامل قبل الانتقال إلى التالية.</li>
<li><b>حصة متساوية للجميع</b> — تقسيم متساوٍ بين الولايات الثلاث عشرة.</li>
</ul>
<p>في الحالات الثلاث، لا يمكن لأي ولاية أن تتلقى مقاعد أكثر من عدد أطفالها خارج المدرسة؛ ويُعاد توزيع الفائض.</p>
<p class="card warn" style="margin-top:8px"><b>نقطة يجب فهمها:</b> النسبة الوطنية بعد المحاكاة <b>واحدة في القواعد الثلاث</b>. هذا أمر حسابي — فالعدد الإجمالي للأطفال المتمدرسين لا يتوقف على طريقة توزيعهم. ما يتغير هو التوزيع: كم ولاية حُلَّت مشكلتها، وعند أي مستوى تبقى الأكثر تأخراً. لهذا يُعرض هذان الرقمان. <b>لا توجد قاعدة «صحيحة» بين الثلاث</b>: التركيز يحل مشكلة بضع ولايات ويترك أخرى كما هي، والتوزيع يخفف عن الجميع دون أن يحل مشكلة أحد. المفاضلة سياسية لا إحصائية. الأداة تنيرها ولا تحسمها.</p>
<p>لم نضع <b>أي أرقام للتكلفة</b> عن قصد. فمقعد في مدرسة يكلّف غير ما يكلّفه جسر انطلاقاً من المحظرة، ولا نملك بيانات تكلفة موثوقة. تحويل الأطفال إلى أوقية سيكون اختلاقاً لا تحليلاً.</p>
<p><b>لكننا نحوّل الأطفال إلى موارد مادية</b>، انطلاقاً من فرضيتين فقط، معروضتين على الشاشة وقابلتين للتعديل: عدد التلاميذ لكل قاعة (40 افتراضياً، وهو الحد الأقصى الموصى به في المعايير الدنيا لشبكة INEE للتعليم الابتدائي) وعدد القاعات لكل مدرسة (6 افتراضياً). ويُحتسب مدرّس واحد لكل قاعة.</p>
<p>ونوع المورد يتبع الآلية. في حالتَي <b>الإقصاء</b> و<b>الحجم المرتفع</b>: قاعات جديدة والمدارس التي تحتضنها. نحتسب البناء الجديد في الحالتين لأننا لا نملك أي بيانات عن الطاقة المتبقية في المدارس القائمة، وافتراض قدرتها على استيعاب هؤلاء الأطفال لا يستند إلى شيء. وفي حالة <b>الإحلال</b>: أقسام جسر واعتماد المحاظر القائمة — فالطفل الذي يتعلم بالفعل يحتاج إلى معادلة لا إلى مبنى.</p>
<p>وإذا كانت الوزارة تعرف المقاعد المتاحة في المدارس القائمة، فستحصل على حاجة بناء أقل من حاجتنا. ورقمنا إذن <b>حد أعلى</b>، وهذا مقصود.</p>

<h3>6. حدود الدراسة</h3>
<p class="card warn" style="margin-top:8px">ما <b>لا تسمح</b> هذه البيانات بقوله:</p>
<ul>
<li>EPCV هو <b>عيّنة</b>. النسب تقديرات. في الولايات الصغيرة هامش الخطأ واسع: ±4.5 نقطة لإنشيري (267 طفلاً) و±4.1 لتكانت، مقابل ±1.7 في نواكشوط. الفوارق في الترتيب بين ولايات متجاورة تُقرأ بحذر.</li>
<li>المقتطف المستعمل <b>لا يتضمن أوزان السبر</b>. النسب محسوبة على العينة الخام وقد تختلف قليلاً عن الأرقام الرسمية المنشورة من ANSADE.</li>
<li>النسب تعود إلى <b>2019</b> وتُطبَّق على سكان 2019. لا شيء يؤكد أنها ما تزال صالحة اليوم.</li>
<li>نقيس ما إذا كان الطفل <b>قد التحق</b> بالمدرسة، لا ما إذا كان فيها اليوم ولا ما يتعلمه. الطفل المسجل الغائب يُحتسب متمدرساً.</li>
<li>لا نقيس <b>جودة</b> التعليم ولا بُعد المدرسة ولا حالة المباني ولا عدد المدرسين. التشخيص ليس مخطط بناء.</li>
<li>لا <b>نتنبأ بشيء</b>. تصف EduFocus وضعاً قائماً وتجعله قابلاً للمقارنة. لا تقول ماذا سيحدث إذا استثمرنا.</li>
<li>أوزان المؤشر (45/35/20) <b>اختيار</b> لا نتيجة. صانع قرار يفضّل الشدة سيحصل على ترتيب آخر — ولهذا نعرض المعادلة.</li>
</ul>

<h3>7. التصريح باستخدام الذكاء الاصطناعي (المادة 5)</h3>
<p class="card warn" style="margin-top:8px">استعان الفريق بمساعد ذكاء اصطناعي (Claude من Anthropic) خلال الهاكاثون. ويُصرَّح بهذا الاستخدام وفقاً للمادة 5 من النظام الداخلي.<br><br>
<b>ما حدده الفريق وقرره:</b> اختيار الموضوع والإشكالية؛ قرار الحصول على قاعدة EPCV 2019 من ANSADE، وهي قاعدة ليست ضمن البيانات المقدمة من المنظمين؛ تعريف «خارج المدرسة النظامية» وقرار الفصل بين التعليم القرآني أو المحظرة وبين الغياب التام للتعليم — وهي الفكرة المحورية للمشروع؛ أوزان المؤشر (45 / 35 / 20)؛ المواصفات التفصيلية لكل شاشة من التطبيق؛ تأويل النتائج والرسائل المعتمدة.<br><br>
<b>ما أُنجز بمساعدة المساعد:</b> شيفرة التحليل بلغة Python (ربط القاعدتين، حساب المؤشرات والمؤشر المركّب والآليات)؛ شيفرة HTML وCSS وJavaScript الخاصة بالنموذج؛ تحرير النصوص التفسيرية وترجمتها إلى العربية والإنجليزية؛ توليد التوصيات لكل ولاية انطلاقاً من قواعد اتُّفق عليها مع الفريق؛ مجموعة الاختبارات الآلية؛ تصميم لوحة القيادة وإعادة تصميم المحاكي بثلاث قواعد للتوزيع.<br><br>
<b>التحقق:</b> أُعيد حساب كل رقم معروض انطلاقاً من البيانات المصدرية وقُورن بوثيقة تسليم الفريق. وتُرفق شيفرات التحليل مع المشروع، ما يتيح لأي شخص إعادة إنتاج الحسابات كاملة.</p>

<h3>8. المصادر</h3>
<p class="src">1. السكان حسب الولاية، 2013-2019. قاعدة مقدمة من إدارة الهاكاثون — IndabaX موريتانيا، نسخة 2026.<br><br>
2. المسح الدائم لظروف معيشة الأسر (EPCV 2019). الوكالة الوطنية للإحصاء والتحليل الديموغرافي والاقتصادي (ANSADE)، الجمهورية الإسلامية الموريتانية. المقتطف المستعمل: 60,600 فرد، 13 ولاية. تم الحصول عليها من ANSADE، المنتج الرسمي للإحصاءات الديموغرافية وإحصاءات الفقر في البلاد، ومتاحة عند الطلب لدى الوكالة.<br><br>
5. المعايير الدنيا لشبكة INEE: 40 تلميذاً لكل مدرّس كحد أقصى في التعليم الابتدائي. تُستعمل كفرضية افتراضية في المحاكي، قابلة للتعديل من طرف المستخدم.<br><br>3. خلفية الخريطة: Natural Earth، المستوى الإداري الأول (ملك عام)، مبسّطة إلى 1.2 كلم.<br><br>
4. الموارد مفتوحة المصدر المستعملة: خطوط Poppins وNunito Sans (رخصة SIL OFL 1.1)، وIBM Plex Sans Arabic وAmiri (رخصة SIL OFL 1.1). لا توجد أي مكتبة رسوم خارجية: الخريطة والحلقات والرسوم كتبها الفريق بصيغة SVG.</p>

/* ── 12. Langue ────────────────────────────────────────────────────────── */
function setLang(l){
  L=l; t=T[l];
  document.documentElement.lang=l;
  document.documentElement.dir = l==='ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('.langs button').forEach(b=>
    b.setAttribute('aria-pressed', b.dataset.lang===l));
  document.querySelectorAll('[data-t]').forEach(el=>{ el.textContent = t[el.dataset.t] ?? ''; });
  document.getElementById('methBody').innerHTML=METH[l];
  drawTabs(); drawHome(); drawMap(); drawRank(); drawSim();
  drawCmpOptions(); drawCmp(); drawSheet();
  try{ localStorage.setItem('edufocus.lang',l); }catch(e){}
}
document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
window.matchMedia('(min-width:1024px)').addEventListener('change',()=>{
  if(current==='home') drawHomeMap();
});

/* ── 13. Démarrage ─────────────────────────────────────────────────────── */
function boot(){
  let l='fr';
  try{ l=localStorage.getItem('edufocus.lang')||'fr'; }catch(e){}
  if(!T[l]) l='fr';
  document.querySelector('.wrap').classList.toggle('wide', current==='home');
  setLang(l);
}
/* Si un fichier wilayas.csv est déposé à côté de la page, il remplace la copie
   embarquée. Sinon la page fonctionne telle quelle, y compris hors connexion. */
if(location.protocol.startsWith('http')){
  fetch('wilayas.csv',{cache:'no-store'})
    .then(r=>r.ok?r.text():Promise.reject())
    .then(txt=>{ const d=lireCsv(txt); if(d.length===13) DATA=d; })
    .catch(()=>{})
    .finally(boot);
}else{ boot(); }   /* ouverture directe du fichier : copie embarquée */
