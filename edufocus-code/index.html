<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EduFocus — Où investir dans l'éducation en Mauritanie</title>
<meta name="description" content="EduFocus classe les 13 wilayas de Mauritanie selon la priorité éducative et dit, pour chacune, quoi faire.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- Aperçu lorsque le lien est partagé (WhatsApp, LinkedIn, X) -->
<meta property="og:type" content="website">
<meta property="og:title" content="EduFocus — 365 231 enfants hors de l'école">
<meta property="og:description" content="Où investir dans l'éducation en Mauritanie. Les 13 wilayas classées, expliquées, et le levier d'action pour chacune.">
<meta property="og:image" content="apercu.png">
<meta property="og:locale" content="fr_FR">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#1A4A6B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════════════
   CHARTE — 5 couleurs de marque + 1 échelle de priorité à 4 crans
   Pour changer la charte : ne toucher qu'à ce bloc.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  /* ── Ardoise ── neutres froids, marque bleu-ardoise ─────────────────── */
  --sable:#F5F7F8;   /* fond          */
  --encre:#171B1F;   /* texte         */
  --gris:#6A7480;    /* secondaire    */
  --acc:#1A4A6B;     /* marque, accent unique */
  --acc2:#2A6B94;    /* accent clair (dégradés, survol) */
  --acc0:#163F5C;    /* accent sombre */

  /* échelle de PRIORITÉ : quatre intensités d'une même teinte, du plus
     urgent au moins urgent. C'est une donnée ordonnée, pas des catégories. */
  --p1:#1C4E70; --p2:#3E799E; --p3:#8FB3C9; --p4:#CBDCE6;
  --p1t:#FFFFFF; --p2t:#FFFFFF; --p3t:#122B3A; --p4t:#122B3A;   /* texte lisible dessus */

  /* couleurs SÉMANTIQUES, réservées à une seule signification chacune */
  --or:#C08A2E;      /* mahadra ou école coranique */
  --ri:#A6413B;      /* aucune instruction — la seule alerte de la page */
  --ok:#3F7D5F;      /* objectif atteint */

  --papier:#FFFFFF; --trait:#E2E6EA; --trait2:#EDF0F2;

  --serif:'Poppins','Nunito Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --sans:'Nunito Sans','IBM Plex Sans Arabic','Noto Naskh Arabic','Geeza Pro',system-ui,
    -apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --r:4px;
  --safe:env(safe-area-inset-bottom,0px);
}
html[dir=rtl]{
  --serif:'IBM Plex Sans Arabic','Noto Naskh Arabic','Geeza Pro','Traditional Arabic',
    'Poppins',sans-serif;
  --sans:'IBM Plex Sans Arabic','Noto Naskh Arabic','Geeza Pro','Nunito Sans',sans-serif;
}
h1,h2,h3,.count,.sval,.keys dd,.mets dd,.synth strong{letter-spacing:-.02em}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--sable); color:var(--encre);
  font-family:var(--sans); font-size:16px; line-height:1.55;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(64px + var(--safe));
}
h1,h2,h3{font-family:var(--serif); font-weight:600; line-height:1.2; margin:0}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc); outline-offset:2px; border-radius:2px}
table{border-collapse:collapse;width:100%}

/* ─────────────────────────────────────────────── entête ─────────────── */
/* En-tête. NE PAS nommer « .bar » : cette classe sert aussi aux lignes de
   graphique, qui hériteraient alors du fond bleu et du position:sticky. */
.topbar{
  position:sticky; top:0; z-index:40; display:flex; align-items:center;
  gap:12px; padding:10px 16px; background:var(--acc); color:#fff;
}
.brand{font-family:var(--serif); font-size:19px; font-weight:700; letter-spacing:-.01em;
  white-space:nowrap; flex:none; min-width:0}
.brand span{opacity:.62; font-weight:400; font-size:14px; display:none}
.spacer{flex:1}
.langs{display:flex; gap:1px; background:rgba(255,255,255,.22); border-radius:var(--r); overflow:hidden}
.langs button{padding:5px 9px; font-size:12px; font-weight:600; letter-spacing:.04em; color:#fff; opacity:.72}
.langs button[aria-pressed=true]{background:#fff; color:var(--acc); opacity:1}

/* ─────────────────────────────────────────────── navigation ─────────── */
.tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex;
  background:var(--papier); border-top:1px solid var(--trait);
  padding-bottom:var(--safe);
}
.tabs button{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:8px 2px 9px; font-size:10.5px; font-weight:500; color:var(--gris);
  letter-spacing:.01em; border-top:2px solid transparent; margin-top:-1px;
}
.tabs button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current=page]{color:var(--acc); border-top-color:var(--acc)}

/* ─────────────────────────────────────────────── mise en page ───────── */
.wrap{max-width:900px; margin:0 auto; padding:20px 16px 28px;
  transition:max-width .2s ease}
.screen{display:none; animation:in .28s ease}
.screen.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11px; font-weight:600; letter-spacing:.13em; text-transform:uppercase;
  color:var(--gris); margin-bottom:8px}
.lede{color:var(--gris); font-size:14.5px; margin-top:8px}
h2.title{font-size:24px; letter-spacing:-.01em}
.card{background:var(--papier); border:1px solid var(--trait); border-radius:10px; padding:16px;
  box-shadow:0 1px 2px rgba(22,33,28,.04)}
.mt{margin-top:20px} .mt2{margin-top:32px}

/* ─────────────────────── SIGNATURE : la grille de 100 personnes ─────── */
:root{
  --pers:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 16'%3E%3Ccircle cx='6' cy='3.3' r='3.05'/%3E%3Cpath d='M6 7.5c3.3 0 6 2.7 6 6V16H0v-2.5c0-3.3 2.7-6 6-6z'/%3E%3C/svg%3E");
}
.waffle{display:grid; grid-template-columns:repeat(10,1fr); gap:3px 4px; direction:ltr}
.waffle i{display:block; aspect-ratio:12/16; background-color:var(--trait2);
  -webkit-mask:var(--pers) center/contain no-repeat;
  mask:var(--pers) center/contain no-repeat;
  transform:scale(.4); opacity:0; animation:pop .34s ease forwards}
@keyframes pop{to{transform:scale(1); opacity:1}}
.waffle i.f{background-color:var(--p3)}   /* école formelle */
.waffle i.m{background-color:var(--or)}   /* mahadra / coranique */
.waffle i.n{background-color:var(--ri)}   /* aucune instruction */
.wkey{display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:13px; font-size:13px}
.wkey span{display:flex; align-items:center; gap:7px; color:var(--gris)}
.wkey b{width:11px; height:15px; flex:none;
  -webkit-mask:var(--pers) center/contain no-repeat;
  mask:var(--pers) center/contain no-repeat}
.wkey em{font-style:normal; color:var(--encre); font-weight:700}
@media (prefers-reduced-motion:reduce){
  .waffle i{animation:none; transform:none; opacity:1}
  .screen{animation:none}
}

/* ─────────────────────────────────────────────── accueil ────────────── */
/* L'accroche est posée sur un bandeau vert pleine largeur — vert et or du
   drapeau mauritanien — qui la détache nettement du tableau de bord. */
.hero{position:relative; text-align:center; margin:-20px -16px 0; padding:26px 20px 30px;
  background:
    radial-gradient(120% 90% at 50% 0%, var(--acc2) 0%, var(--acc) 55%, var(--acc0) 100%);
  color:#fff; overflow:hidden}
.hero::after{content:''; position:absolute; left:0; right:0; bottom:0; height:3px;
  background:linear-gradient(90deg,var(--p3) 0 67%,var(--or) 67% 84%,var(--ri) 84% 100%)}
.kicker{font-size:10.5px; font-weight:700; letter-spacing:.19em; text-transform:uppercase;
  color:rgba(255,255,255,.62); margin-bottom:12px}
.count{font-family:var(--serif); font-size:clamp(52px,17vw,88px); line-height:.92;
  letter-spacing:-.05em; color:#fff; font-weight:800; text-shadow:0 2px 18px rgba(0,0,0,.22)}
.count-sub{font-size:14.5px; margin:12px auto 0; max-width:31ch; color:rgba(255,255,255,.9);
  font-weight:500; line-height:1.5}

/* trois repères compacts, tous à la même hauteur */
.kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px}
.kpis div{background:var(--papier); border:1px solid var(--trait); border-radius:10px;
  padding:12px 8px; text-align:center; box-shadow:0 1px 2px rgba(22,33,28,.04)}
.kpis b{display:block; font-family:var(--serif); font-size:clamp(21px,6.6vw,28px);
  font-weight:800; color:var(--acc); letter-spacing:-.035em; line-height:1}
.kpis i{display:block; font-style:normal; font-size:10.5px; color:var(--gris);
  line-height:1.35; margin-top:6px}

/* chaque tuile garde sa hauteur naturelle : plus de grands vides */
.dashgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;
  align-items:start}
.tile{background:var(--papier); border:1px solid var(--trait); border-radius:10px;
  padding:15px; box-shadow:0 1px 2px rgba(22,33,28,.04)}
.tile-wide{grid-column:1/-1}
.tile-accent{background:linear-gradient(160deg,var(--acc2),var(--acc0)); border-color:transparent;
  color:#fff; box-shadow:0 2px 10px rgba(26,74,107,.22)}
.tile-accent .tile-lab,.tile-accent .tile-note{color:rgba(255,255,255,.72)}
.tile-quote{border:none; border-inline-start:3px solid var(--or); border-radius:0 10px 10px 0;
  padding:16px 18px; box-shadow:none; background:#fff}
.tile-quote p{font-family:var(--serif); font-size:16px; font-weight:600; line-height:1.5;
  letter-spacing:-.015em}
.tile-lab{font-size:10px; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
  color:var(--gris); margin-bottom:12px; line-height:1.4}
.tile-note{font-size:12px; color:var(--gris); line-height:1.5; margin-top:10px}

/* camembert en anneau, tracé en SVG pur */
.donut{display:grid; place-items:center; gap:9px}
.donut svg{width:118px; height:118px; display:block}
.donut svg circle{transition:stroke-dasharray .8s cubic-bezier(.2,.8,.3,1)}
.donut .mid{font-family:var(--serif); font-weight:800; fill:var(--encre);
  letter-spacing:-.03em}
.dleg .dom{font-weight:700}
.dleg{display:grid; gap:5px; width:100%}
.dleg span{display:flex; align-items:center; gap:7px; font-size:12px; line-height:1.3}
.dleg b{width:10px; height:10px; border-radius:2px; flex:none}
.dleg em{font-style:normal; color:var(--gris); margin-inline-start:auto;
  font-variant-numeric:tabular-nums}

.bars{display:grid; gap:8px}
.bars-13{gap:4px}
.bars-13 .bar{grid-template-columns:104px 1fr 46px; font-size:11.5px}
.bars-13 .bar-t{height:14px}
.segs.segs-sm{grid-template-columns:repeat(3,1fr); gap:5px; margin-bottom:13px}
.segs.segs-sm button{padding:7px 6px; text-align:center; font-size:12px; font-weight:600}
.bar{display:grid; grid-template-columns:88px 1fr auto; align-items:center; gap:9px;
  font-size:12.5px; cursor:pointer}
.bar:hover .bar-n{color:var(--acc)}
.bar-n{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bar-t{height:17px; background:var(--trait2); border-radius:3px; overflow:hidden}
.bar-t i{display:block; height:100%; border-radius:3px; width:0;
  transition:width .7s cubic-bezier(.2,.8,.3,1)}
.bar-v{font-variant-numeric:tabular-nums; font-weight:600; font-size:12px}

.split{display:flex; height:40px; border-radius:5px; overflow:hidden; gap:2px}
.split div{display:grid; place-items:center; font-size:12px; font-weight:700; color:#fff;
  min-width:0; overflow:hidden; white-space:nowrap; transition:flex-grow .6s ease}
.ctx{margin-top:14px; font-size:12.5px; color:var(--gris); text-align:center; max-width:48ch;
  margin-inline:auto; line-height:1.5}
.cta{display:block; width:100%; margin-top:20px; padding:16px; background:var(--acc);
  color:#fff; font-weight:700; font-size:15.5px; border-radius:10px; text-align:center;
  letter-spacing:.01em; box-shadow:0 2px 8px rgba(26,74,107,.2); transition:.15s}
.cta:hover{background:var(--acc2); box-shadow:0 4px 14px rgba(26,74,107,.28)}


/* ── Disposition Atlas : la carte reste à gauche, le reste défile ──────── */
.atlas{display:block}
.atlas-map{display:none}                    /* petit écran : l'onglet Carte suffit */
.mapcard{background:var(--papier); border:1px solid var(--trait); border-radius:10px;
  padding:15px; box-shadow:0 1px 2px rgba(22,33,28,.04)}
.mapbox-home{border:none; box-shadow:none; padding:0; background:none}
@media (min-width:1024px){
  .atlas{display:grid; grid-template-columns:minmax(380px,44fr) minmax(0,56fr);
    gap:14px; align-items:start; margin-top:14px}
  .atlas-map{display:block; position:sticky;
    top:calc(var(--barh,53px) + var(--tabsh,46px) + 14px)}
  .atlas-flow{min-width:0}
  .atlas-flow .kpis{margin-top:0}
  .atlas-flow .dashgrid{margin-top:10px}
  .mapcard .legend{margin-top:10px; font-size:12px}
  .mapcard .lbl span{font-size:11px}
  .mapcard .lbl u{width:17px; height:17px; font-size:10px}
  /* La colonne droite est plus étroite que la fenêtre : 2 colonnes, pas 4. */
  .atlas-flow .dashgrid{grid-template-columns:repeat(2,1fr); gap:12px}
  /* 20 colonnes plutôt que 10 : la grille reste lisible sans manger la page. */
  .atlas-flow .waffle{grid-template-columns:repeat(20,1fr); gap:3px 5px}
  .atlas-flow .tile-wide{grid-column:1/-1}
  .atlas-flow .kpis{grid-template-columns:repeat(3,1fr)}
  .atlas-flow .bars-13 .bar{grid-template-columns:118px 1fr 48px; font-size:12px}
  .atlas-flow .bars-13{gap:5px}
  .atlas-flow .bar{grid-template-columns:112px 1fr auto}
  .cta{margin-top:14px}
  .ctx{margin-top:12px; text-align:start; max-width:none}
}

/* ─────────────────────────────────────────────── carte ──────────────── */
.mapbox{position:relative; background:var(--papier); border:1px solid var(--trait);
  border-radius:10px; padding:8px; direction:ltr; box-shadow:0 1px 2px rgba(22,33,28,.04)}
.stage{position:relative}
.mapbox svg{display:block; width:100%; height:auto}
.mapbox path{stroke:var(--papier); stroke-width:2.2; cursor:pointer;
  transition:filter .15s, opacity .15s}
.mapbox path:hover,.mapbox path.sel{filter:brightness(1.14); stroke:var(--encre); stroke-width:2.6}
.badges{position:absolute; inset:0; pointer-events:none}
.lbl{position:absolute; transform:translate(-50%,-50%); pointer-events:auto;
  display:flex; align-items:center; gap:4px; padding:2px 6px 2px 2px;
  background:rgba(255,255,255,.93); border-radius:100px; cursor:pointer;
  box-shadow:0 1px 4px rgba(22,33,28,.22); white-space:nowrap;
  transition:box-shadow .15s, transform .15s}
.lbl u{width:15px; height:15px; border-radius:50%; color:#fff; font-size:9px;
  font-weight:800; display:grid; place-items:center; text-decoration:none; flex:none}
.lbl span{font-size:9.5px; font-weight:700; color:var(--encre); letter-spacing:-.01em}
.lbl:hover,.lbl.sel{box-shadow:0 0 0 2px var(--acc),0 2px 8px rgba(22,33,28,.3);
  transform:translate(-50%,-50%) scale(1.06); z-index:4}
.lbl.out{background:rgba(255,255,255,.97)}
/* Sur un petit écran, 13 noms ne tiennent pas sans se chevaucher : la carte
   ne porte que les rangs, les noms restent lisibles dans la liste en dessous. */
@media (max-width:759px){
  .lbl{padding:0; background:none; box-shadow:none; gap:0}
  .lbl span{display:none}
  .lbl u{width:20px; height:20px; font-size:10.5px;
    box-shadow:0 0 0 1.5px rgba(255,255,255,.92),0 1px 3px rgba(22,33,28,.35)}
  .lbl:hover,.lbl.sel{box-shadow:none}
  .lbl.sel u{box-shadow:0 0 0 2.5px var(--encre)}
}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:14px}
.chip{display:inline-flex; align-items:center; gap:7px; padding:5px 11px 5px 5px;
  border:1px solid var(--trait); background:var(--papier); border-radius:100px;
  font-size:12.5px; font-weight:500; white-space:nowrap}
.chip u{width:19px; height:19px; border-radius:50%; color:#fff; font-size:10.5px;
  font-weight:700; display:grid; place-items:center; text-decoration:none; flex:none}
.chip:hover{border-color:var(--acc)}
.chip.sel{border-color:var(--acc); box-shadow:inset 0 0 0 1px var(--acc)}
.tip{position:absolute; pointer-events:none; background:var(--encre); color:#fff;
  padding:7px 10px; border-radius:var(--r); font-size:12.5px; line-height:1.4;
  transform:translate(-50%,-118%); opacity:0; transition:opacity .12s; white-space:nowrap; z-index:5}
.tip.on{opacity:1}
.tip b{display:block; font-size:13.5px; margin-bottom:1px}
.legend{display:flex; flex-wrap:wrap; gap:8px 14px; margin-top:12px; font-size:13px}
.legend span{display:flex; align-items:center; gap:7px; color:var(--gris)}
.legend b{width:13px;height:13px;border-radius:2px;flex:none}
.pick{margin-top:14px; background:var(--papier); border:1px solid var(--trait);
  border-radius:var(--r); padding:14px; display:flex; align-items:center; gap:12px}
.pick .txt{flex:1; min-width:0}
.pick h3{font-size:17px}
.pick p{font-size:13px; color:var(--gris); margin-top:2px}
.pick button{background:var(--acc); color:#fff; padding:9px 13px; border-radius:var(--r);
  font-size:13.5px; font-weight:600; white-space:nowrap}

/* ─────────────────────────────────────────────── tableau ────────────── */
.scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--trait);
  border-radius:10px; background:var(--papier); box-shadow:0 1px 2px rgba(22,33,28,.04)}
th,td{padding:9px 10px; text-align:start; font-size:13.5px; border-bottom:1px solid var(--trait2)}
thead th{position:sticky; top:0; background:var(--papier); font-size:11px; font-weight:600;
  letter-spacing:.07em; text-transform:uppercase; color:var(--gris); white-space:nowrap;
  cursor:pointer; user-select:none; border-bottom:1px solid var(--trait)}
thead th:hover{color:var(--acc)}
thead th.s::after{content:'↓'; margin-inline-start:4px; color:var(--acc)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--sable)}
tbody tr:last-child td{border-bottom:none}
.num{text-align:end; font-variant-numeric:tabular-nums}
.dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-inline-end:7px;
  vertical-align:middle; flex:none}
.rk{font-family:var(--serif); font-weight:600; color:var(--gris)}
.btn{display:inline-flex; align-items:center; gap:7px; margin-top:14px; padding:10px 14px;
  border:1px solid var(--trait); background:var(--papier); border-radius:var(--r);
  font-size:13.5px; font-weight:500}
.btn:hover{border-color:var(--acc); color:var(--acc)}

/* ─────────────────────────────────────────────── fiche ──────────────── */
.back{display:inline-flex; align-items:center; gap:6px; font-size:13.5px; color:var(--gris);
  margin-bottom:12px}
.back:hover{color:var(--acc)}
html[dir=rtl] .back svg{transform:scaleX(-1)}
.fh{display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap}
.fh h2{font-size:29px; letter-spacing:-.015em}
.badge{display:inline-block; padding:4px 10px; border-radius:100px; color:#fff;
  font-size:12px; font-weight:600; white-space:nowrap}
.keys{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--trait);
  border:1px solid var(--trait); border-radius:var(--r); overflow:hidden; margin-top:18px}
.keys div{background:var(--papier); padding:12px 13px}
.keys dt{font-size:11.5px; color:var(--gris); line-height:1.3}
.keys dd{margin:3px 0 0; font-family:var(--serif); font-size:22px; font-weight:600}
.why{margin-top:20px; background:var(--papier); border:1px solid var(--trait);
  border-inline-start:4px solid var(--or); border-radius:var(--r); padding:16px}
.why h3{font-size:16px; margin-bottom:8px}
.why p{font-size:15px; line-height:1.62}
.lever{margin-top:14px; background:var(--acc); color:#fff; border-radius:var(--r); padding:14px 16px}
.lever small{display:block; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  opacity:.66; margin-bottom:4px}
.lever strong{font-size:16px; font-weight:600; line-height:1.4}
.gen{display:grid; gap:9px; margin-top:12px}
.grow{display:grid; grid-template-columns:70px 1fr auto; align-items:center; gap:10px; font-size:13.5px}
.gbar{height:22px; background:var(--trait2); border-radius:2px; overflow:hidden}
.gbar i{display:block; height:100%; background:var(--acc); border-radius:2px;
  transition:width .5s ease}
.gap{margin-top:10px; font-size:13.5px; color:var(--gris)}
.acts{margin-top:14px; background:var(--papier); border:1px solid var(--trait);
  border-radius:8px; padding:16px}
.acts h3{font-size:16px; margin-bottom:12px}
.actlist{list-style:none; counter-reset:a; margin:0; padding:0; display:grid; gap:12px}
.actlist li{counter-increment:a; position:relative; padding-inline-start:34px}
.actlist li::before{content:counter(a); position:absolute; inset-inline-start:0; top:1px;
  width:23px; height:23px; border-radius:50%; background:var(--acc); color:#fff;
  font-size:12px; font-weight:700; display:grid; place-items:center}
.actlist b{display:block; font-size:14.5px; font-weight:700; line-height:1.35}
.actlist span{display:block; font-size:13.5px; color:var(--gris); line-height:1.55;
  margin-top:3px}

/* ─────────────────────────────────────────────── simulateur ─────────── */
.slider{margin-top:6px}
.slider input{width:100%; accent-color:var(--acc); height:32px}
.sval{font-family:var(--serif); font-size:34px; font-weight:600; color:var(--acc); line-height:1}
.segs{display:grid; grid-template-columns:1fr; gap:6px}
.segs button{text-align:start; padding:10px 12px; border:1px solid var(--trait);
  background:var(--sable); border-radius:var(--r); font-size:13.5px; line-height:1.35}
.segs button b{display:block; font-weight:600; font-size:14px}
.segs button small{color:var(--gris); font-size:12.5px}
.segs button[aria-pressed=true]{background:var(--acc); border-color:var(--acc); color:#fff}
.segs button[aria-pressed=true] small{color:rgba(255,255,255,.78)}
.synth{margin-top:18px; background:var(--acc); color:#fff; border-radius:var(--r);
  padding:18px 16px; text-align:center}
.synth strong{font-family:var(--serif); font-size:24px; font-weight:600; display:block;
  margin:4px 0}
.synth small{display:block; font-size:13px; opacity:.78}
.note{margin-top:9px; font-size:12.5px; color:var(--gris); line-height:1.5;
  border-inline-start:3px solid var(--or); padding-inline-start:10px}
.hyps{display:grid; grid-template-columns:1fr 1fr; gap:9px}
.hyps label{display:block; font-size:12.5px; color:var(--gris); line-height:1.35}
.hyps input{width:100%; margin-top:5px; padding:9px 10px; font:inherit; font-size:15px;
  font-weight:700; font-family:var(--serif); color:var(--acc); background:var(--sable);
  border:1px solid var(--trait); border-radius:8px; text-align:center}
.hyps input:focus{outline:2px solid var(--acc); outline-offset:1px}
.moyens{display:grid; grid-template-columns:repeat(3,1fr); gap:9px}
.moyens div{background:var(--papier); border:1px solid var(--trait); border-radius:10px;
  padding:13px 10px; text-align:center; box-shadow:0 1px 2px rgba(22,33,28,.04)}
.moyens b{display:block; font-family:var(--serif); font-size:clamp(20px,6vw,27px);
  font-weight:800; color:var(--acc); letter-spacing:-.03em; line-height:1}
.moyens i{display:block; font-style:normal; font-size:11px; color:var(--gris);
  line-height:1.35; margin-top:6px}
.moyens small{display:block; font-size:10px; color:var(--gris); opacity:.8; margin-top:3px}
.mets{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--trait);
  border:1px solid var(--trait); border-radius:var(--r); overflow:hidden; margin-top:16px}
.mets div{background:var(--papier); padding:13px}
.mets dt{font-size:11.5px; color:var(--gris); line-height:1.3}
.mets dd{margin:4px 0 0; font-family:var(--serif); font-size:24px; font-weight:600}
.arw{color:var(--gris); font-size:11px; margin:0 4px}
.aft{color:var(--acc); font-weight:600}
.aft.zero{color:var(--ok)}
@media (min-width:760px){ .segs{grid-template-columns:repeat(3,1fr)} }

/* ─────────────────────────────────────────────── comparateur ────────── */
.cmp{display:grid; grid-template-columns:1fr 1fr; gap:12px}
select{width:100%; padding:10px; font:inherit; font-size:14px; background:var(--papier);
  border:1px solid var(--trait); border-radius:var(--r); color:var(--encre)}
.cmp-row{display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:10px 0;
  border-top:1px solid var(--trait2)}
.cmp-lab{grid-column:1/-1; font-size:11px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--gris); margin-bottom:-4px}
.cmp-val{font-family:var(--serif); font-size:19px; font-weight:600}
.cmp-val.hi{color:var(--ri)}

/* ─────────────────────────────────────────────── méthodologie ───────── */
.meth h3{font-size:17px; margin:22px 0 7px}
.meth p,.meth li{font-size:14.5px; color:var(--encre); line-height:1.65}
.meth ul{margin:6px 0; padding-inline-start:20px}
.meth li{margin:4px 0}
.formula{background:var(--papier); border:1px solid var(--trait); border-radius:var(--r);
  padding:14px; margin-top:10px; font-size:14px; line-height:1.9; direction:ltr;
  text-align:start}
.formula code{font-family:var(--sans); font-weight:600; color:var(--acc)}
.warn{border-inline-start:4px solid var(--or)}
.src{font-size:12.5px; color:var(--gris); line-height:1.6}

/* ─────────────────────────────────────────────── desktop ────────────── */
@media (min-width:1240px){ .wrap.wide{max-width:1240px} }
@media (min-width:760px){
  body{padding-bottom:0; padding-top:0}
  /* Pleine largeur : sinon le contenu défile visiblement à côté de la barre. */
  .tabs{position:sticky; top:var(--barh,53px); bottom:auto; border-top:none;
    border-bottom:1px solid var(--trait); max-width:none; margin:0;
    padding:0 16px; justify-content:center; z-index:29}
  .tabs button{flex:0 0 auto; flex-direction:row; gap:7px; padding:11px 16px; font-size:13.5px;
    border-top:none; border-bottom:2px solid transparent; margin-top:0}
  .tabs button[aria-current=page]{border-top-color:transparent; border-bottom-color:var(--acc)}
  .tabs button svg{width:17px;height:17px}
  .topbar{padding:12px 20px}
  .wrap{padding:26px 20px 60px}
  .keys{grid-template-columns:repeat(3,1fr)}
  .stats strong{font-size:25px}
  .hero{margin:-26px -20px 0; padding:40px 24px 44px; border-radius:0 0 14px 14px}
  .kpis{margin-top:20px; gap:10px}
  .dashgrid{grid-template-columns:repeat(4,1fr); gap:12px}
  .tile-wide{grid-column:span 2}
  .tile{padding:18px}
  .kpis b{font-size:30px}
  .kpis i{font-size:11.5px}
  .count{font-size:clamp(56px,7vw,86px)}
  .brand span{display:inline}
  .donut svg{width:132px; height:132px}
  .mapbox{padding:14px}
  .lbl span{font-size:12px} .lbl u{width:19px;height:19px;font-size:11px}
  .chip{font-size:13.5px}
}

/* ─────────────────────────────────────────────── impression ─────────── */
@media print{
  .topbar,.tabs,.back,.btn,.cta,.pick button{display:none!important}

  .lever small{opacity:1; color:var(--acc)}
  .waffle i{animation:none; transform:none; opacity:1;
    -webkit-print-color-adjust:exact; print-color-adjust:exact}
  *{-webkit-print-color-adjust:exact; print-color-adjust:exact}
}

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   EduFocus — IndabaX Mauritanie 2026
   L'application lit UNE seule source de données (wilayas.csv) et se contente
   de l'afficher. Aucun indicateur n'est recalculé ici : indice, rang, niveau
   de priorité et mécanisme sont produits en amont par l'analyste.
   Seule exception assumée : la répartition proportionnelle du simulateur.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── 1. Source de données ──────────────────────────────────────────────── */
const CSV_EMBARQUE = `wilaya,wilaya_ar,wilaya_en,population_2019,enfants_6_14,enfants_hors_ecole,taux_hors_ecole,taux_pauvrete,part_rurale,taux_garcons,taux_filles,pct_mahadra,pct_aucune_instruction,ratio_dependance,indice,rang,niveau_priorite,mecanisme,explication,explication_ar,explication_en,n_echantillon,part_nationale,actions,actions_ar,actions_en,enfants_sans_instruction,enfants_mahadra,salles_necessaires
Guidimakha,كيدي ماغة,Guidimakha,308457,93317,41469,44.4,54.3,85.9,45.8,43.1,1.9,42.5,111,81,1,Très élevée,Exclusion,"Guidimakha est classé en priorité très élevée (rang 1 sur 13). 41 469 enfants de 6 à 14 ans n'ont jamais fréquenté l'école formelle, soit 44,4 % de cette classe d'âge. Le taux de pauvreté y atteint 54 % et 86 % de la population vit en milieu rural. 42,5 % des enfants ne reçoivent aucune instruction, contre 1,9 % en mahadra ou école coranique : ces enfants sont hors de tout circuit d'apprentissage. Le levier prioritaire est la création d'offre scolaire.","تُصنَّف ولاية كيدي ماغة ضمن أولوية قصوى (الرتبة 1 من 13). 41,469 طفلاً تتراوح أعمارهم بين 6 و14 سنة لم يلتحقوا قط بالمدرسة النظامية، أي 44.4 % من هذه الفئة العمرية. يبلغ معدل الفقر 54 % ويعيش 86 % من السكان في الوسط الريفي. 42.5 % من الأطفال لا يتلقون أي تعليم، مقابل 1.9 % في المحظرة أو الكتّاب: هؤلاء الأطفال خارج كل مسار تعليمي. الأولوية هي بناء المدارس.","Guidimakha ranks 1 of 13, very high priority. 41,469 children aged 6 to 14 have never attended formal school — 44.4 % of that age group. The poverty rate reaches 54 % and 86 % of the population lives in rural areas. 42.5 % of children receive no instruction at all, against 1.9 % in mahadra or Quranic school: these children are outside every learning path. The priority is to build schools.",1879,11.4,"Ouvrir des écoles::39 660 enfants ne reçoivent aucune instruction. Il faut environ 992 salles de classe pour les accueillir. | S'appuyer sur les mahadras existantes::1 773 enfants y suivent déjà un enseignement. Les certifier coûte moins cher que de construire, et donne un résultat plus vite. | Lever l'obstacle du coût::54 % de la population vit dans la pauvreté. Cantines scolaires, gratuité des fournitures et transferts aux familles conditionnent la fréquentation réelle.","فتح مدارس::39,660 طفلاً لا يتلقون أي تعليم. يلزم نحو 992 قاعة دراسية لاستقبالهم. | الاعتماد على المحاظر القائمة::1,773 طفلاً يدرسون فيها بالفعل. اعتمادها أقل كلفة من البناء ويعطي نت st justifiée.","رفع الطاقة الاستيعابية::65,995 طفلاً خارج المدرسة، أي نحو 1,650 قاعة دراسية والمدرسين اللازمين لها. | الاعتماد على المحاظر القائمة::38,557 طفلاً يدرسون فيها بالفعل. اعتمادها أقل كلفة من البناء ويعطي نتيجة أسرع. | استهداف الأحياء لا الولاية::الوسط حضري في معظمه (100 %). الحاجة ليست موزعة بالتساوي: إنها تتركز في الأحياء الطرفية. | استهداف الأولاد أولاً::يبلغ الفارق 6.5 نقطة على حساب الأولاد. وهو من أوسع الفوارق في البلاد: حملة موجّهة لها ما يبررها.","Increase intake capacity::65,995 children out of school — about 1,650 classrooms and the teachers to staff them. | Build on the existing mahadras::38,557 children already study there. Certifying them costs less than building and delivers results faster. | Target neighbourhoods, not the wilaya::The area is mostly urban (100 %). The need is not evenly spread: it concentrates in outlying neighbourhoods. | Target boys first::The gap reaches 6.5 points against boys. It is one of the widest in the country: a targeted campaign is warranted.",27389,38557,1650

ن يعيشون في فقر. المطاعم المدرسية ومجانية اللوازم والتحويلات للأسر هي ما يحدد الحضور الفعلي.","Open schools::5,362 children receive no instruction at all. About 134 classrooms are needed to take them in. | Build on the existing mahadras::1,221 children already study there. Certifying them costs less than building and delivers results faster. | Remove the cost barrier::40 % of the population lives in poverty. School canteens, free supplies and cash transfers to families decide whether children actually attend.",5362,1221,165
Inchiri,إنشيري,Inchiri,24425,5494,926,16.9,27.5,22.8,19.1,14.7,12.4,4.5,73,17,10,Faible,Substitution,"Inchiri est classé en priorité faible (rang 10 sur 13). 926 enfants de 6 à 14 ans n'ont jamais fréquenté l'école formelle, soit 16,9 % de cette classe d'âge. Le taux de pauvreté y atteint 27 % et 23 % de la population vit en milieu rural. 12,4 % des enfants suivent une mahadra ou une école coranique et 4,5 % seulement ne reçoivent aucune instruction : la majorité apprend déjà, mais hors du système reconnu. Le levier prioritaire est la passerelle vers le formel.",تُصنَّف ولاية إنشيري ضمن أولوية منخفضة (الرتبة 10 من 13). 926 طفلاً تتراوح أعمارهم بين 6 و14 سنة لم يلتحقوا قط بالمدرسة النظامية، أي 16.9 % من هذه الفئة العمرية. يبلغ معدل الفقر 27 % ويعيش 23 % من السكان في الوسط الريفي. 12.4 % من الأطفال يدرسون في المحظرة أو الكتّاب و4.5 % فقط لا يتلقون أي تعليم: الأغلبية تتعلم بالفعل لكن خارج النظام المعترف به. الأولوية هي إنشاء جسور نحو التعليم النظامي.,"Inchiri ranks 10 of 13, low priority. 926 children aged 6 to 14 have never attended formal school — 16.9 % of that age group. The poverty rate reaches 27 % and 23 % of the population lives in rural areas. 12.4 % of children attend a mahadra or Quranic school and only 4.5 % receive no instruction: most are already learning, but outside the recognised system. The priority is bridges into formal schooling.",267,0.3,"Créer des passerelles::681 enfants sont en mahadra ou école coranique. Ils apprennent déjà : il faut reconnaître leurs acquis et leur ouvrir l'accès au diplôme. | Ne pas oublier les enfants sans aucune instruction::247 enfants ne sont nulle part, ni à l'école ni en mahadra. Les passerelles ne les atteindront pas : il leur faut une école. | Cibler les quartiers, pas la wilaya::Le milieu est majoritairement urbain (77 %). Le besoin n'est pas réparti également : il se concentre dans les quartiers périphériques. | Viser d'abord les garçons::L'écart atteint 4,4 points au détriment de les garçons. C'est l'un des écarts les plus marqués du pays : une campagne ciblée est justifiée.",إنشاء جسور::681 طفلاً يدرسون في المحظرة أو الكتّاب. هم يتعلمون بالفعل: يجب الاعتراف بمكتسباتهم وفتح الطريق أمامهم نحو الشهادة. | عدم نسيان الأطفال بلا أي تعليم::247 طفلاً ليسوا في أي مكان، لا في المدرسة ولا في المحظرة. الجسور لن تصل إليهم: يحتاجون إلى مدرسة. | استهداف الأحياء لا الولاية::الوسط حضري في معظمه (77 %). الحاجة ليست موزعة بالتساوي: إنها تتركز في الأحياء الطرفية. | استهداف الأولاد أولاً::يبلغ الفارق 4.4 نقطة على حساب الأولاد. وهو من أوسع الفوارق في البلاد: حملة موجّهة لها ما يبررها.,"Build bridges::681 children attend a mahadra or Quranic school. They are already learning: recognise what they know and open the path to a qualification. | Do not forget children with no instruction::247 children are nowhere — neither school nor mahadra. Bridges will not reach them: they need a school. | Target neighbourhoods, not the wilaya::The area is mostly urban (77 %). The need is not evenly spread: it concentrates in outlying neighbourhoods. | Target boys first::The gap reaches 4.4 points against boys. It is one of the widest in the country: a targeted campaign is warranted.",247,681,23

/* Analyseur CSV tolérant aux guillemets et aux virgules dans les textes */
function lireCsv(txt){
  txt = txt.replace(/^\uFEFF/,'').trim();
  const L=[]; let f='',r=[],q=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ r.push(f); f=''; }
    else if(c==='\n'){ r.push(f); L.push(r); r=[]; f=''; }
    else if(c!=='\r') f+=c;
  }
  if(f||r.length){ r.push(f); L.push(r); }
  const h=L.shift().map(s=>s.trim());
  const NUM=new Set(['population_2019','enfants_6_14','enfants_hors_ecole','taux_hors_ecole',
    'taux_pauvrete','part_rurale','taux_garcons','taux_filles','pct_mahadra',
    'pct_aucune_instruction','ratio_dependance','indice','rang','n_echantillon','part_nationale']);
  return L.filter(r=>r.length>1&&r[0]!=='').map(r=>{
    const o={}; h.forEach((k,i)=>{
      let v=(r[i]??'').trim();
      o[k] = NUM.has(k) ? (v===''||isNaN(+v) ? null : +v) : (v===''?null:v);
    }); return o;
  });
}

let L='fr', t=T.fr;

/* ── 3. Utilitaires d'affichage ────────────────────────────────────────── */
const ND = () => t.nd;
function num(v){
  if(v===null||v===undefined||Number.isNaN(v)) return ND();
  const s = Math.round(v).toString();
  return L==='fr' ? s.replace(/\B(?=(\d{3})+(?!\d))/g,'\u202F')
                  : s.replace(/\B(?=(\d{3})+(?!\d))/g,',');
}
function pct(v,d=1){
  if(v===null||v===undefined||Number.isNaN(v)) return ND();
  const s = v.toFixed(d);
  return (L==='fr' ? s.replace('.',',') : s) + ' %';
}
function nom(w){ return L==='ar' ? (w.wilaya_ar||w.wilaya) : L==='en' ? (w.wilaya_en||w.wilaya) : w.wilaya; }
function expl(w){ return (L==='ar'?w.explication_ar : L==='en'?w.explication_en : w.explication) || ND(); }
/* Les actions viennent du fichier, écrites « titre::détail », séparées par « | ». */
function actions(w){
  const raw = (L==='ar'?w.actions_ar : L==='en'?w.actions_en : w.actions) || '';
  const items = raw.split('|').map(s=>s.trim()).filter(Boolean);
  if(!items.length) return `<p class="tile-note">${ND()}</p>`;
  return `<ol class="actlist">` + items.map(it=>{
    const i = it.indexOf('::');
    const ti = i<0 ? it : it.slice(0,i).trim();
    const de = i<0 ? '' : it.slice(i+2).trim();
    return `<li><b>${esc(ti)}</b>${de?`<span>${esc(de)}</span>`:''}</li>`;
  }).join('') + `</ol>`;
}
const COL = {"Très élevée":"var(--p1)","Élevée":"var(--p2)","Moyenne":"var(--p3)","Faible":"var(--p4)"};
/* Les deux tons clairs de l'échelle demandent un texte foncé pour rester lisibles. */
const COLT = {"Très élevée":"var(--p1t)","Élevée":"var(--p2t)","Moyenne":"var(--p3t)","Faible":"var(--p4t)"};
const txtOn = w => COLT[w.niveau_priorite] || 'var(--encre)';
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Répartit 100 carrés sans jamais dépasser 100 (méthode du plus fort reste) */
function cent(w){
  const raw=[100-(w.taux_hors_ecole??0), w.pct_mahadra??0, w.pct_aucune_instruction??0];
  const fl=raw.map(Math.floor); let r=100-fl.reduce((a,b)=>a+b,0);
  raw.map((v,i)=>[v-fl[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{ if(r>0){fl[i]++;r--;} });
  return fl;
}
function waffle(w,anim=true){
  const [f,m,n]=cent(w); let h='';
  for(let i=0;i<100;i++){
    const c = i<f?'f' : i<f+m?'m':'n';
    const d = anim ? `style="animation-delay:${(i*5)}ms"` : 'style="animation:none;opacity:1;transform:none"';
    h += `<i class="${c}" ${d}></i>`;
  }
  return h;
}
function waffleKey(w){
  const [f,m,n]=cent(w);
  return [['var(--p3)',f,t.waffle[0]],['var(--or)',m,t.waffle[1]],['var(--ri)',n,t.waffle[2]]]
    .map(([c,v,l])=>`<span><b style="background-color:${c}"></b><em>${v}</em> ${esc(l)}</span>`).join('');
}

const SCREENS=[['home','s-home','home'],['map','s-map','map'],['rank','s-rank','rank'],
               ['sim','s-sim','sim'],['meth','s-meth','meth']];
let current='home';

/* Les hauteurs d'en-tête varient avec la langue et la police : on les mesure
   plutôt que de les coder en dur, sinon un filet de contenu passe au travers. */
function mesureBarres(){
  const bar=document.querySelector('.topbar'), tabs=document.getElementById('tabs');
  const r=document.documentElement.style;
  if(bar)  r.setProperty('--barh',  Math.ceil(bar.getBoundingClientRect().height)+'px');
  if(tabs) r.setProperty('--tabsh', Math.ceil(tabs.getBoundingClientRect().height)+'px');
}
addEventListener('resize', mesureBarres);

function drawTabs(){
  document.getElementById('tabs').innerHTML = SCREENS.map(([k,,ic],i)=>
    `<button data-go="${k}" ${current===k?'aria-current="page"':''}>
       <svg viewBox="0 0 24 24">${ICON[ic]}</svg><span>${esc(t.nav[i])}</span></button>`).join('');
  requestAnimationFrame(mesureBarres);
}
function go(k){
  current=k;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  const id = k==='sheet'?'s-sheet' : k==='cmp'?'s-cmp' : (SCREENS.find(s=>s[0]===k)||[])[1];
  document.getElementById(id).classList.add('on');
  document.querySelector('.wrap').classList.toggle('wide', k==='home');
  drawTabs();
  window.scrollTo({top:0,behavior:'instant'});
  if(k==='home'){ drawHomeMap(); animateCounter(); }
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-go]'); if(b) go(b.dataset.go);
});

/* ── 5. Accueil ────────────────────────────────────────────────────────── */
let counted=false;
function animateCounter(){
  const el=document.getElementById('counter'), end=NAT.enfants;
  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches){ el.textContent=num(end); return; }
  const t0=performance.now(), dur=1400;
  (function step(now){
    const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3);
    el.textContent=num(Math.round(end*e));
    if(p<1) requestAnimationFrame(step);
  })(performance.now());
}
/* Anneau en SVG pur : la circonférence d'un rayon de 15.915 vaut 100,
   les parts se lisent donc directement en pourcentage. */
function donut(parts, midV, note){
  let off=25, segs='';
  parts.forEach(p=>{
    segs+=`<circle cx="21" cy="21" r="15.915" fill="none" stroke="${p.c}"
      stroke-width="6.4" stroke-dasharray="${p.v.toFixed(2)} ${(100-p.v).toFixed(2)}"
      stroke-dashoffset="${off}"></circle>`;
    off = (off - p.v + 100) % 100;
  });
  const leg=parts.map((p,i)=>`<span${i?'':' class="dom"'}><b style="background:${p.c}"></b>
    ${esc(p.n)} <em>${pct(p.v,0)} · ${num(p.e)}</em></span>`).join('');
  return `<svg viewBox="0 0 42 42" role="img" aria-label="${esc(note)}">
      <circle cx="21" cy="21" r="15.915" fill="none" stroke="var(--trait2)" stroke-width="6.4"/>
      ${segs}
      <text class="mid" x="21" y="23.6" text-anchor="middle" font-size="9.4">${midV}</text>
    </svg><div class="dleg">${leg}</div><p class="tile-note">${esc(note)}</p>`;
}

function drawHome(){
  const nat={taux_hors_ecole:NAT.taux, pct_mahadra:NAT.mahadra, pct_aucune_instruction:NAT.aucune};
  document.getElementById('natWaffle').innerHTML=waffle(nat);
  document.getElementById('natKey').innerHTML=waffleKey(nat);

  const tri=[...DATA].sort((a,b)=>b.enfants_hors_ecole-a.enfants_hors_ecole);
  const tot=DATA.reduce((s,w)=>s+(w.enfants_hors_ecole||0),0);
  const pire=[...DATA].sort((a,b)=>b.taux_hors_ecole-a.taux_hors_ecole)[0];
  const top5=tri.slice(0,5).reduce((s,w)=>s+w.enfants_hors_ecole,0);

  /* Trois repères */
  document.getElementById('k1').textContent=pct(NAT.taux);
  document.getElementById('k2').textContent=pct(top5/tot*100,0);
  document.getElementById('k3').textContent=pct(pire.taux_hors_ecole);
  document.querySelector('[data-t="kpi3"]').textContent=
    t.kpi3.replace('%s', nom(pire));

  /* Deux anneaux : qui sont ces enfants ? */
  document.getElementById('dSex').innerHTML=donut(
    [{n:t.boys, v:NAT.sexG, e:Math.round(tot*NAT.sexG/100), c:'var(--acc2)'},
     {n:t.girls,v:100-NAT.sexG, e:Math.round(tot*(100-NAT.sexG)/100), c:'var(--p3)'}],
    pct(NAT.sexG,0),
    t.noteSex.replace('%g',pct(NAT.txG)).replace('%f',pct(NAT.txF)));
  document.getElementById('dMil').innerHTML=donut(
    [{n:t.rural, v:NAT.milR, e:Math.round(tot*NAT.milR/100), c:'var(--ri)'},
     {n:t.urban, v:100-NAT.milR, e:Math.round(tot*(100-NAT.milR)/100), c:'var(--p3)'}],
    pct(NAT.milR,0),
    t.noteMil.replace('%r',pct(NAT.txR)).replace('%u',pct(NAT.txU)));

  /* Les cinq plus gros besoins, cliquables */
  const mx=tri[0].enfants_hors_ecole||1;
  document.getElementById('natBars').innerHTML=tri.slice(0,5).map(w=>
    `<div class="bar" data-w="${esc(w.wilaya)}">
       <span class="bar-n">${esc(nom(w))}</span>
       <div class="bar-t"><i style="background:${COL[w.niveau_priorite]||'var(--gris)'}"
         data-pc="${(w.enfants_hors_ecole/mx*100).toFixed(1)}"></i></div>
       <span class="bar-v">${num(w.enfants_hors_ecole)}</span></div>`).join('');
  document.querySelectorAll('#natBars .bar').forEach(el=>
    el.onclick=()=>openSheet(el.dataset.w));
  requestAnimationFrame(()=>document.querySelectorAll('#natBars .bar-t i')
    .forEach(i=>i.style.width=i.dataset.pc+'%'));

  /* Mahadra contre absence totale d'instruction */
  const mah=DATA.reduce((s,w)=>s+(w.pct_mahadra||0)/100*(w.enfants_6_14||0),0);
  const auc=DATA.reduce((s,w)=>s+(w.pct_aucune_instruction||0)/100*(w.enfants_6_14||0),0);
  document.getElementById('natSplit').innerHTML=
    `<div style="background:var(--or);flex:${mah}">${num(mah)}</div>
     <div style="background:var(--ri);flex:${auc}">${num(auc)}</div>`;

  drawCompare();
  drawHomeMap();
  animateCounter();
}

               'Dakhlet Nouadhibou':[112,388], 'Guidimakha':[292,756],

/* Fabrique le SVG du pays + les étiquettes. Utilisé par l'écran Carte et,
   sur grand écran, par la colonne fixe du tableau de bord. */
function mapMarkup(cls){
  const paths=Object.entries(CARTE.paths).map(([k,d])=>{
    const w=DATA.find(x=>x.wilaya===k);
    const c=w?(COL[w.niveau_priorite]||'var(--trait2)'):'var(--trait2)';
    return `<path d="${d}" fill="${c}" data-w="${esc(k)}"></path>`;
  }).join('');
  const traits=Object.entries(DEPORT).map(([k,[x,y]])=>{
    const c=CARTE.centres[k]; if(!c) return '';
    return `<line x1="${x}" y1="${y}" x2="${c[0]}" y2="${c[1]}"
      stroke="var(--gris)" stroke-width="1.6" opacity=".55"></line>`;
  }).join('');
  const lab=Object.keys(CARTE.paths).map(k=>{
    const w=DATA.find(z=>z.wilaya===k); if(!w) return '';
    const [x,y]=DEPORT[k]||CARTE.centres[k];
    return `<button class="lbl${DEPORT[k]?' out':''}" data-w="${esc(k)}"
      style="left:${(x/CARTE.w*100).toFixed(2)}%; top:${(y/CARTE.h*100).toFixed(2)}%">
      <u style="background:${COL[w.niveau_priorite]||'var(--gris)'};color:${txtOn(w)}">${w.rang??'?'}</u>
      <span>${esc(nom(w))}</span></button>`;
  }).join('');
  return `<div class="stage ${cls||''}"><svg viewBox="0 0 ${CARTE.w} ${CARTE.h}" role="img"
      aria-label="${esc(t.mapTitle)}">${paths}${traits}</svg>
      <div class="badges">${lab}</div></div>`;
}
const legendMarkup = () => Object.entries(COL).map(([k,c])=>
  `<span><b style="background:${c}"></b>${esc(t.pr[k])}</span>`).join('');

function drawMap(){
  const box=document.getElementById('mapbox');
  box.innerHTML=mapMarkup()+`<div class="tip" id="tip"></div>`;
  document.getElementById('legend').innerHTML=legendMarkup();
  document.getElementById('chips').innerHTML=[...DATA].sort((a,b)=>a.rang-b.rang).map(w=>
    `<button class="chip" data-w="${esc(w.wilaya)}">
       <u style="background:${COL[w.niveau_priorite]||'var(--gris)'};color:${txtOn(w)}">${w.rang??'?'}</u>
       ${esc(nom(w))}</button>`).join('');

  const tp=document.getElementById('tip');
  const show=(w,ev)=>{
    const r=box.getBoundingClientRect();
    tp.innerHTML=`<b>${esc(nom(w))}</b>${esc(t.rank1.replace('%s',w.rang))} · `+
                 `${num(w.enfants_hors_ecole)} ${esc(t.simChildren)}`;
    tp.style.left=(ev.clientX-r.left)+'px'; tp.style.top=(ev.clientY-r.top)+'px';
    tp.classList.add('on');
  };
  box.querySelectorAll('path,.lbl').forEach(el=>{
    const w=DATA.find(x=>x.wilaya===el.dataset.w); if(!w) return;
    if(hoverable){
      el.addEventListener('mousemove',ev=>show(w,ev));
      el.addEventListener('mouseleave',()=>tp.classList.remove('on'));
      el.addEventListener('click',()=>openSheet(w.wilaya));
    }else{
      el.addEventListener('click',()=>select(w));
    }
  });
  document.querySelectorAll('#chips .chip').forEach(el=>{
    const w=DATA.find(x=>x.wilaya===el.dataset.w); if(!w) return;
    el.onclick=()=> hoverable ? openSheet(w.wilaya) : select(w);
  });
  select(sel?DATA.find(x=>x.wilaya===sel)||null:null);
}
function select(w){
  const pk=document.getElementById('pick');
  document.querySelectorAll('#mapbox path,.lbl,.chip').forEach(p=>p.classList.remove('sel'));

  sel=w.wilaya;
  document.querySelectorAll(`[data-w="${CSS.escape(w.wilaya)}"]`).forEach(p=>p.classList.add('sel'));
  pk.hidden=false;
  document.getElementById('pickName').textContent=nom(w);
  document.getElementById('pickInfo').textContent =
    `${t.rank1.replace('%s',w.rang)} · ${num(w.enfants_hors_ecole)} ${t.simChildren} · ${pct(w.taux_hors_ecole)}`;
  document.getElementById('pickGo').onclick=()=>openSheet(w.wilaya);
}

/* ── 9. Simulateur ─────────────────────────────────────────────────────────
   C'est le seul écran où l'interface calcule, et c'est assumé : une simulation
   est par nature un calcul. Trois règles d'allocation d'une même capacité,
   exprimée en enfants à scolariser. Aucune wilaya ne peut recevoir plus de
   places qu'elle n'a d'enfants hors école : le surplus est redistribué.       */
let REGLE='prorata';
const REGLES=['prorata','priorite','egal'];

function alloue(cap, regle){
  const a={}; DATA.forEach(w=>a[w.wilaya]=0);
  const besoin=w=>w.enfants_hors_ecole||0;
  if(regle==='priorite'){
    let rest=cap;
    [...DATA].sort((x,y)=>(x.rang||99)-(y.rang||99)).forEach(w=>{
      const p=Math.min(rest,besoin(w)); a[w.wilaya]=p; rest-=p;
    });
  }else{
    let rest=cap;
    for(let i=0;i<30 && rest>=1;i++){
      const ouv=DATA.filter(w=>a[w.wilaya] < besoin(w)-0.5);
      if(!ouv.length) break;
      const base=ouv.reduce((s,w)=>s+besoin(w),0)||1;
      ouv.forEach(w=>{
        const q = rest * (regle==='prorata' ? besoin(w)/base : 1/ouv.length);
        a[w.wilaya] += Math.min(q, besoin(w)-a[w.wilaya]);
      });
      rest = cap - Object.values(a).reduce((s,v)=>s+v,0);
    }
  }
  return a;
}

/* Conversion des enfants en moyens concrets. Deux hypothèses seulement, toutes
   deux affichées et modifiables par l'utilisateur. Rien n'est deviné.
   Le type de moyen dépend du mécanisme : on ne construit pas une école pour un
   enfant déjà scolarisé en mahadra, on lui ouvre une passerelle. */
function moyens(w, places){
  const parSalle=Math.max(1, +document.getElementById('hypSalle').value||40);
  const parEcole=Math.max(1, +document.getElementById('hypEcole').value||6);
  const salles=Math.ceil(places/parSalle);
  const construit = w.mecanisme !== 'Substitution';
  return {
    salles,
    enseignants: salles,                                   // un maître par salle
    ecoles: construit ? Math.ceil(salles/parEcole) : 0,
    type: construit ? 'ecoles' : 'passerelles'
  };
}

function drawSim(){
  const rng=document.getElementById('simRange');
  const besoinTot=DATA.reduce((s,w)=>s+(w.enfants_hors_ecole||0),0);
  const enf614=DATA.reduce((s,w)=>s+(w.enfants_6_14||0),0);
  /* Le dernier cran du curseur doit valoir exactement le besoin total, sinon
     il resterait toujours un reliquat d'enfants impossible à couvrir. */
  rng.max=Math.ceil(besoinTot/5000)*5000;
  const cap=Math.min(+rng.value, besoinTot);

  document.getElementById('simVal').textContent=num(cap);
  document.getElementById('simShare').textContent=
    `${pct(cap/besoinTot*100,0)} ${t.simOfNeed}`;

  document.getElementById('simSegs').innerHTML=REGLES.map(r=>
    `<button data-r="${r}" aria-pressed="${r===REGLE}">
       <b>${esc(t.rules[r][0])}</b><small>${esc(t.rules[r][1])}</small></button>`).join('');
  document.querySelectorAll('#simSegs button').forEach(b=>
    b.onclick=()=>{ REGLE=b.dataset.r; drawSim(); });

  const a=alloue(cap,REGLE);
  const place=Object.values(a).reduce((s,v)=>s+v,0);
  const lignes=DATA.map(w=>{
    const p=a[w.wilaya]||0, reste=(w.enfants_hors_ecole||0)-p;
    return {w, p, reste, apres: w.enfants_6_14 ? reste/w.enfants_6_14*100 : null};
  }).filter(o=>o.p>=1);
  /* En mode « les plus urgentes d'abord », le tableau suit l'ordre de l'indice :
     afficher le rang 2 avant le rang 1 rendrait la règle illisible. */
  lignes.sort(REGLE==='priorite'
    ? (x,y)=>(x.w.rang||99)-(y.w.rang||99)
    : (x,y)=>y.p-x.p);

  const natApres=(besoinTot-place)/enf614*100;
  const regl=DATA.filter(w=>(w.enfants_hors_ecole||0)-(a[w.wilaya]||0) < 1).length;
  const pires=DATA.map(w=>({w, tx: w.enfants_6_14
      ? ((w.enfants_hors_ecole||0)-(a[w.wilaya]||0))/w.enfants_6_14*100 : 0}))
    .sort((x,y)=>y.tx-x.tx)[0];

  document.getElementById('simSynth').innerHTML=
    `<small>${esc(t.simPlaces)}</small>
     <strong>${num(place)} ${esc(t.simKids)}</strong>
     <small>${esc(t.simNat)} ${pct(NAT.taux)} <span style="opacity:.6">→</span> ${pct(natApres)}</small>`;
  document.getElementById('simNote').textContent=t.simSame;
  document.getElementById('simSort').textContent=t.simSort;

  document.getElementById('simMets').innerHTML=
    `<div><dt>${esc(t.simSolved)}</dt><dd>${regl} <span style="font-size:15px;
       color:var(--gris)">/ 13</span></dd></div>
     <div><dt>${esc(t.simWorst)}</dt><dd>${pct(pires.tx)}<span style="display:block;
       font-family:var(--sans);font-size:12px;font-weight:400;color:var(--gris)">${esc(nom(pires.w))}</span></dd></div>`;

  const tb=document.getElementById('simTable');
  /* Moyens à mobiliser, agrégés puis détaillés */
  const M=lignes.map(o=>({o, m:moyens(o.w, o.p)}));
  const tSalles=M.reduce((s,x)=>s+x.m.salles,0);
  const tEcoles=M.reduce((s,x)=>s+x.m.ecoles,0);
  const tProfs =M.reduce((s,x)=>s+x.m.enseignants,0);
  const passer =M.filter(x=>x.m.type==='passerelles').reduce((s,x)=>s+x.o.p,0);
  document.getElementById('simMoyens').innerHTML=
    `<div><b>${num(tSalles)}</b><i>${esc(t.moySalles)}</i>
       <small>${esc(t.moyProfs.replace('%s',num(tProfs)))}</small></div>
     <div><b>${num(tEcoles)}</b><i>${esc(t.moyEcoles)}</i>
       <small>${esc(t.moyEcolesN)}</small></div>
     <div><b>${num(passer)}</b><i>${esc(t.moyPass)}</i>
       <small>${esc(t.moyPassN)}</small></div>`;

  tb.querySelector('thead').innerHTML=`<tr><th class="num">${esc(t.simCols.rank)}</th>
    <th>${esc(t.simCols.wilaya)}</th>
    <th class="num">${esc(t.simCols.places)}</th><th class="num">${esc(t.simCols.rate)}</th>
    <th>${esc(t.simCols.moy)}</th><th>${esc(t.simCols.lev)}</th></tr>`;
  tb.querySelector('tbody').innerHTML = M.length ? M.map(({o,m})=>`
    <tr data-w="${esc(o.w.wilaya)}">
      <td class="num rk">${o.w.rang??ND()}</td>
      <td><span class="dot" style="background:${COL[o.w.niveau_priorite]||'var(--gris)'}"></span>${esc(nom(o.w))}</td>
      <td class="num">${num(o.p)}</td>
      <td class="num">${pct(o.w.taux_hors_ecole)}<span class="arw">→</span><span
        class="aft ${o.apres<1?'zero':''}">${pct(o.apres)}</span></td>
      <td>${m.type==='ecoles'
            ? `${num(m.salles)} ${esc(t.moySallesC)}<br><span style="color:var(--gris)">${num(m.ecoles)} ${esc(t.moyEcolesC)}</span>`
            : `${num(m.salles)} ${esc(t.moyPassC)}<br><span style="color:var(--gris)">${esc(t.moyCertC)}</span>`}</td>
      <td>${esc(t.lvShort[o.w.mecanisme]||ND())}</td></tr>`).join('')
    : `<tr><td colspan="6" style="color:var(--gris)">${ND()}</td></tr>`;
  tb.querySelectorAll('tbody tr[data-w]').forEach(tr=>tr.onclick=()=>openSheet(tr.dataset.w));
}

          A.pct_mahadra>B.pct_mahadra, B.pct_mahadra>A.pct_mahadra)}
    ${row(t.waffle[2], pct(A.pct_aucune_instruction), pct(B.pct_aucune_instruction),
          A.pct_aucune_instruction>B.pct_aucune_instruction,
          B.pct_aucune_instruction>A.pct_aucune_instruction)}
    ${row(t.cols.enfants, num(A.enfants_hors_ecole), num(B.enfants_hors_ecole))}
    ${row(t.keys.pauv, pct(A.taux_pauvrete,0), pct(B.taux_pauvrete,0))}
    ${row(t.keys.rural, pct(A.part_rurale,0), pct(B.part_rurale,0))}
    ${row(t.keys.dep, num(A.ratio_dependance), num(B.ratio_dependance))}
    ${row(t.lever, esc(t.lvShort[A.mecanisme]||ND()), esc(t.lvShort[B.mecanisme]||ND()))}
  </div>`;
}

fr:`<h3>1. Les données</h3>
<ul>
<li><b>Population par wilaya, 2013-2019</b> — base fournie par l'organisation du hackathon (IndabaX Mauritanie, édition 2026). Elle donne le <i>nombre</i> d'habitants.</li>
<li><b>EPCV 2019</b> — Enquête Permanente sur les Conditions de Vie des ménages, ANSADE. Extrait exploité : 60 600 individus, 13 wilayas. Elle donne les <i>taux</i> : qui va à l'école, qui est pauvre, garçon ou fille, ville ou campagne. Cette base ne fait pas partie des données fournies : nous sommes allés la chercher auprès de l'ANSADE.</li>
</ul>
<p>Les deux bases sont reliées par la wilaya. Un taux multiplié par une population donne un effectif réel. C'est toute la méthode : <b>nous transformons des pourcentages en enfants</b>.</p>

<h3>2. Ce que veut dire « hors école formelle »</h3>
<p>Un enfant de 6 à 14 ans est compté <b>hors école formelle</b> s'il n'a jamais fréquenté l'école publique ou privée reconnue. Nous séparons ensuite deux situations très différentes :</p>
<ul>
<li><b>Mahadra ou école coranique seulement</b> — l'enfant apprend, mais son parcours ne débouche sur aucun diplôme reconnu. Il lui faut une <i>passerelle</i>.</li>
<li><b>Aucune instruction</b> — l'enfant n'est nulle part. Il lui faut une <i>école</i>.</li>
</ul>
<p>Les deux additionnés font le taux hors école formelle. Cette distinction est le cœur du projet : deux wilayas au même taux peuvent avoir des problèmes opposés.</p>

<h3>3. L'indice de priorité éducative</h3>
<div class="formula">
<code>indice = 0,45 × volume + 0,35 × intensité + 0,20 × vulnérabilité</code><br>
volume = nombre d'enfants hors école · intensité = taux hors école · vulnérabilité = taux de pauvreté<br>
Chaque terme est ramené sur une échelle de 0 à 100 par min-max sur les 13 wilayas :
<code>(x − min) / (max − min) × 100</code>
</div>
<p>Le volume pèse le plus parce qu'un budget se dépense en enfants, pas en pourcentages. L'intensité corrige l'effet de taille. La vulnérabilité rappelle qu'à situation scolaire égale, une wilaya pauvre a moins de moyens propres. L'indice est simple <b>exprès</b> : il s'explique en 30 secondes et n'importe qui peut le recalculer.</p>

<h3>3 bis. Pourquoi 45 / 35 / 20 et pas d'autres chiffres ?</h3>
<p>C'est la question qu'il faut poser, et la réponse honnête tient en deux temps.</p>
<p><b>Le raisonnement derrière chaque poids.</b></p>
<ul>
<li><b>Volume 45 %</b> — c'est la seule des trois grandeurs qui se traduit directement en salles de classe et en enseignants. Un ministère ne construit pas pour un pourcentage. Nous lui donnons le poids majoritaire sans lui donner la majorité absolue : à 50 % ou plus, le classement se réduirait à un tri par population et Nouakchott passerait première, ce qui n'aurait aucun sens pour l'urgence.</li>
<li><b>Intensité 35 %</b> — assez pour corriger l'effet de taille et empêcher les petites wilayas très touchées de disparaître derrière les grandes. C'est le contrepoids du volume, et il est presque aussi lourd que lui.</li>
<li><b>Vulnérabilité 20 %</b> — un poids délibérément minoritaire. La pauvreté n'est pas un indicateur scolaire : elle module la difficulté à agir, elle ne mesure pas le problème. Lui donner plus reviendrait à faire un classement de la pauvreté, pas de l'éducation.</li>
</ul>
<p><b>Ce que change réellement le choix des poids.</b> Nous avons recalculé le classement pour les <b>231 combinaisons de poids possibles</b> par pas de 5 %, de 100/0/0 à 0/0/100. Résultat :</p>
<div class="formula">
Guidimakha, Hodh El Gharbi et Assaba sont dans les cinq premières <code>dans 100 % des cas</code><br>
Guidimakha arrive première <code>dans 67 % des cas</code><br>
Trarza, Inchiri, Dakhlet Nouadhibou, Tiris Zemmour et Adrar n'entrent dans les cinq premières <code>dans aucun cas</code>
</div>
<p class="card warn" style="margin-top:10px"><b>Ce que cela veut dire, et ce que cela ne veut pas dire.</b> Le classement fin <b>bouge</b> avec les poids : seul un tiers des combinaisons donne exactement le même top 5, et Hodh El Charghi peut descendre au 10<sup>e</sup> rang si l'on ne regarde que l'intensité. Nous ne prétendons pas que 45/35/20 soit la seule pondération défendable.<br><br>En revanche, <b>l'ensemble des wilayas prioritaires est robuste</b>. Trois wilayas sont dans les cinq premières quoi qu'on fasse, et cinq n'y entrent jamais. Autrement dit : le choix des poids déplace l'ordre, il ne déplace pas la décision. Un décideur qui privilégierait l'intensité investirait dans les mêmes régions, dans un ordre différent.</p>
<p>C'est pourquoi la formule est affichée : elle n'est pas là pour être crue, elle est là pour être recalculée.</p>

<h3>4. Le mécanisme</h3>
<ul>
<li><b>Exclusion</b> — la majorité des enfants hors école ne reçoit aucune instruction. Levier : créer de l'offre scolaire.</li>
<li><b>Substitution</b> — la majorité est en mahadra ou école coranique. Levier : passerelles et équivalences.</li>
<li><b>Volume élevé</b> — la wilaya pèse au moins 15 % du besoin national alors que son taux reste sous la moyenne (33,1 %). Le problème est un problème de masse. Levier : capacité d'accueil.</li>
</ul>

<h3>5. Le simulateur</h3>
<p>Le simulateur répond à une question de répartition, pas de budget. Vous fixez une <b>capacité exprimée en enfants</b> — le nombre d'enfants que vous pouvez scolariser — et vous choisissez une règle. L'outil montre où vont les places et ce qu'il reste après.</p>
<ul>
<li><b>Selon le nombre</b> — chaque wilaya reçoit une part proportionnelle à son nombre d'enfants hors école.</li>
<li><b>Les plus urgentes d'abord</b> — on suit l'ordre de l'indice et on règle chaque wilaya entièrement avant de passer à la suivante.</li>
<li><b>La même part pour chacune</b> — partage égal entre les 13 wilayas.</li>
</ul>
<p>Dans les trois cas, aucune wilaya ne peut recevoir plus de places qu'elle n'a d'enfants hors école ; le surplus est redistribué aux autres.</p>
<p class="card warn" style="margin-top:8px"><b>Un point à comprendre :</b> le taux national après simulation est <b>identique pour les trois règles</b>. C'est arithmétique — le nombre total d'enfants scolarisés ne dépend pas de la façon de les répartir. Ce qui change, c'est la distribution : combien de wilayas voient leur problème réglé, et à quel niveau reste la plus en retard. C'est pourquoi ces deux chiffres sont affichés. <b>Aucune des trois règles n'est « la bonne »</b> : concentrer règle quelques wilayas et en laisse d'autres intactes, étaler soulage tout le monde sans régler personne. L'arbitrage est politique, pas statistique. L'outil l'éclaire, il ne le tranche pas.</p>
<p>Nous ne chiffrons volontairement <b>aucun coût</b>. Une place en école coûte autre chose qu'une passerelle depuis une mahadra, et nous n'avons pas de données de coût fiables. Convertir des enfants en ouguiyas serait une invention, pas une analyse.</p>
<p><b>En revanche, nous convertissons les enfants en moyens matériels</b>, à partir de deux hypothèses seulement, toutes deux affichées à l'écran et modifiables : le nombre d'élèves par salle de classe (40 par défaut, maximum recommandé par les normes minimales de l'INEE pour le primaire) et le nombre de salles par école (6 par défaut). Un enseignant est compté par salle.</p>
<p>Le type de moyen dépend du mécanisme :</p>
<ul>
<li><b>Exclusion</b> et <b>Volume élevé</b> — des salles neuves et les écoles qui les abritent. Nous comptons des constructions neuves dans les deux cas : nous ne disposons d'aucune donnée sur la capacité résiduelle des écoles existantes, et supposer qu'elles peuvent absorber ces enfants serait une hypothèse que rien ne soutient.</li>
<li><b>Substitution</b> — des classes passerelles et la certification de mahadras existantes. On ne construit pas une école pour un enfant qui apprend déjà : il lui faut une équivalence, pas un bâtiment.</li>
</ul>
<p>Si le ministère connaît les places disponibles dans les écoles existantes, il obtiendra un besoin de construction inférieur au nôtre. Notre chiffre est donc un <b>majorant</b>, et c'est volontaire.</p>

<h3>6. Les limites</h3>
<p class="card warn" style="margin-top:8px">Ce que ces données <b>ne permettent pas</b> de dire :</p>
<ul>
<li>L'EPCV est un <b>échantillon</b>. Les taux sont des estimations. Sur les petites wilayas la marge d'erreur est large : ±4,5 points pour l'Inchiri (267 enfants enquêtés) et ±4,1 pour le Tagant, contre ±1,7 à Nouakchott. Les écarts de rang entre wilayas voisines dans le classement doivent être lus avec prudence.</li>
<li>L'extrait exploité <b>ne comporte pas de pondération de sondage</b>. Les taux sont calculés sur l'échantillon brut ; ils peuvent s'écarter légèrement des chiffres officiels publiés par l'ANSADE.</li>
<li>Les taux datent de <b>2019</b> et sont appliqués à la population 2019. Rien ne dit qu'ils sont encore valables aujourd'hui.</li>
<li>Nous mesurons si l'enfant est <b>déjà allé</b> à l'école, pas s'il y est aujourd'hui ni ce qu'il y apprend. Un enfant inscrit mais absent est compté comme scolarisé.</li>
<li>Nous ne mesurons <b>ni la qualité</b> de l'enseignement, ni la distance à l'école, ni l'état des bâtiments, ni le nombre d'enseignants disponibles. Un diagnostic n'est pas un plan de construction.</li>
<li>Nous ne <b>prédisons rien</b>. EduFocus décrit une situation observée et la rend comparable. Il ne dit pas ce qui se passera si l'on investit.</li>
<li>Les pondérations de l'indice (45/35/20) sont un <b>choix</b>, pas un résultat. Un décideur qui privilégierait l'intensité obtiendrait un autre classement — c'est pourquoi la formule est affichée.</li>
</ul>

<h3>7. Déclaration d'usage de l'intelligence artificielle (Article 5)</h3>
<p class="card warn" style="margin-top:8px">L'équipe a utilisé un assistant IA (Claude, Anthropic) pendant le hackathon. Cet usage est déclaré conformément à l'article 5 du règlement.<br><br>
<b>Défini et décidé par l'équipe :</b> le choix du thème et de la problématique ; la décision d'aller chercher l'EPCV 2019 auprès de l'ANSADE, base qui ne fait pas partie des données fournies par l'organisation ; la définition de « hors école formelle » et la décision de séparer l'enseignement coranique ou mahadra de l'absence totale d'instruction — l'idée centrale du projet ; les pondérations de l'indice (45 / 35 / 20) ; la spécification écran par écran de l'application ; l'interprétation des résultats et les messages retenus.<br><br>

<b>Vérification :</b> tous les chiffres affichés ont été recalculés depuis les données sources et confrontés au document de soumission de l'équipe. Les scripts d'analyse sont fournis avec le projet, ce qui permet à quiconque de refaire l'intégralité des calculs.</p>

<h3>8. Sources</h3>
<p class="src">1. Population par wilaya, 2013-2019. Base fournie par l'organisation du hackathon — IndabaX Mauritanie, Édition 2026.<br><br>
2. Enquête Permanente sur les Conditions de Vie des ménages (EPCV 2019). Agence Nationale de la Statistique et de l'Analyse Démographique et Économique (ANSADE), République Islamique de Mauritanie. Extrait exploité : 60 600 individus, 13 wilayas. Base obtenue auprès de l'ANSADE, producteur officiel des statistiques démographiques et de pauvreté du pays, accessible sur demande auprès de l'Agence.<br><br>

4. Ressources open source utilisées : polices Poppins et Nunito Sans (SIL Open Font License 1.1), IBM Plex Sans Arabic et Amiri (SIL OFL 1.1). Aucune bibliothèque graphique externe : la carte, les anneaux et les graphiques sont écrits en SVG par l'équipe.</p>

<h3>9. Note technique</h3>
<p class="src">L'application lit une seule source, <code>wilayas.csv</code> (13 lignes). Tous les indicateurs — indice, rang, niveau de priorité, mécanisme, explication — sont calculés en amont et figurent dans le fichier. L'interface ne recalcule rien, à une exception près, assumée et documentée en section 5 : l'allocation du simulateur. Aucune donnée n'est envoyée ailleurs ; la page fonctionne hors connexion.</p>`,

en:`<h3>1. The data</h3>
<ul>
<li><b>Population by wilaya, 2013-2019</b> — base provided by the hackathon organisers (IndabaX Mauritania, 2026 edition). It gives the <i>number</i> of people.</li>
<li><b>EPCV 2019</b> — Permanent Household Living Conditions Survey, ANSADE. Extract used: 60,600 individuals, 13 wilayas. It gives the <i>rates</i>: who goes to school, who is poor, boy or girl, town or countryside. This base was not part of the data supplied: we obtained it from ANSADE.</li>
</ul>
<p>The two bases are joined on the wilaya. A rate multiplied by a population gives a real headcount. That is the whole method: <b>we turn percentages into children</b>.</p>

<h3>2. What "out of formal school" means</h3>
<p>A child aged 6 to 14 counts as <b>out of formal school</b> if they have never attended a recognised public or private school. We then separate two very different situations:</p>
<ul>
<li><b>Mahadra or Quranic school only</b> — the child is learning, but the path leads to no recognised qualification. They need a <i>bridge</i>.</li>
<li><b>No instruction at all</b> — the child is nowhere. They need a <i>school</i>.</li>
</ul>
<p>Added together, these give the out-of-formal-school rate. This distinction is the heart of the project: two wilayas with the same rate can have opposite problems.</p>

<h3>3. The educational priority index</h3>
<div class="formula">
<code>index = 0.45 × volume + 0.35 × intensity + 0.20 × vulnerability</code><br>
volume = children out of school · intensity = out-of-school rate · vulnerability = poverty rate<br>
Each term is rescaled 0-100 by min-max across the 13 wilayas:
<code>(x − min) / (max − min) × 100</code>
</div>
<p>Volume weighs most because budgets are spent on children, not on percentages. Intensity corrects for size. Vulnerability recalls that, at equal schooling, a poor wilaya has fewer means of its own. The index is <b>deliberately</b> simple: it can be explained in 30 seconds and recomputed by anyone.</p>

<h3>3 bis. Why 45 / 35 / 20 and not other figures?</h3>
<p>That is the question to ask, and the honest answer comes in two parts.</p>
<ul>
<li><b>Volume 45 %</b> — the only one of the three that translates directly into classrooms and teachers. A ministry does not build for a percentage. It gets the largest weight but not an absolute majority: at 50 % or more the ranking would collapse into a population sort and Nouakchott would come first, which makes no sense for urgency.</li>
<li><b>Intensity 35 %</b> — enough to correct for size and stop small, badly affected wilayas from vanishing behind large ones. It is the counterweight to volume, and almost as heavy.</li>
<li><b>Vulnerability 20 %</b> — deliberately a minority weight. Poverty is not a schooling indicator: it modulates how hard action will be, it does not measure the problem. Giving it more would produce a poverty ranking, not an education one.</li>
</ul>
<p><b>What the choice of weights actually changes.</b> We recomputed the ranking for all <b>231 possible weight combinations</b> in steps of 5 %, from 100/0/0 to 0/0/100:</p>
<div class="formula">
Guidimakha, Hodh El Gharbi and Assaba are in the top five <code>in 100 % of cases</code><br>
Guidimakha ranks first <code>in 67 % of cases</code><br>
Trarza, Inchiri, Dakhlet Nouadhibou, Tiris Zemmour and Adrar reach the top five <code>in no case at all</code>
</div>
<p class="card warn" style="margin-top:10px"><b>What this means, and what it does not.</b> The fine ranking <b>does move</b> with the weights: only a third of the combinations give exactly the same top five, and Hodh Ech Chargui can fall to 10th if intensity alone is used. We do not claim 45/35/20 is the only defensible weighting.<br><br>But <b>the set of priority wilayas is robust</b>. Three are in the top five whatever you do, and five never are. In other words: the choice of weights shifts the order, not the decision. A decision-maker favouring intensity would invest in the same regions, in a different order.</p>
<p>That is why the formula is displayed: it is not there to be believed, it is there to be recomputed.</p>

<h3>4. The mechanism</h3>
<ul>
<li><b>Exclusion</b> — most out-of-school children receive no instruction at all. Lever: build school provision.</li>
<li><b>Substitution</b> — most attend a mahadra or Quranic school. Lever: bridges and equivalences.</li>
<li><b>High volume</b> — the wilaya holds at least 15 % of the national need while its rate stays below average (33.1 %). The problem is one of scale. Lever: intake capacity.</li>
</ul>

<h3>5. The simulator</h3>
<p>The simulator answers a question of distribution, not of budget. You set a <b>capacity expressed in children</b> — how many children you can put into school — and choose a rule. The tool shows where the places go and what remains afterwards.</p>
<ul>
<li><b>By numbers</b> — each wilaya receives a share proportional to its out-of-school children.</li>
<li><b>Most urgent first</b> — following the index order, each wilaya is settled in full before moving to the next.</li>
<li><b>An equal share each</b> — split evenly between the 13 wilayas.</li>
</ul>
<p>In all three cases no wilaya can receive more places than it has out-of-school children; the surplus is redistributed.</p>
<p class="card warn" style="margin-top:8px"><b>One thing to understand:</b> the national rate after simulation is <b>identical under all three rules</b>. This is arithmetic — the total number of children schooled does not depend on how they are spread. What changes is the distribution: how many wilayas see their problem settled, and how far behind the worst one remains. That is why those two figures are displayed. <b>None of the three rules is "the right one"</b>: concentrating settles a few wilayas and leaves others untouched, spreading eases everyone without settling anyone. The trade-off is political, not statistical. The tool illuminates it; it does not decide it.</p>
<p>We deliberately put <b>no cost figures</b> on this. A school place costs something different from a bridge out of a mahadra, and we have no reliable cost data. Converting children into ouguiyas would be invention, not analysis.</p>
<p><b>We do, however, convert children into physical resources</b>, from two assumptions only, both shown on screen and editable: pupils per classroom (40 by default, the maximum recommended by INEE minimum standards for primary) and classrooms per school (6 by default). One teacher is counted per classroom.</p>
<p>The kind of resource follows the mechanism. Under <b>Exclusion</b> and <b>High volume</b>: new classrooms and the schools to house them. We count new construction in both cases because we have no data on spare capacity in existing schools, and assuming they could absorb these children would rest on nothing. Under <b>Substitution</b>: bridging classes and certification of existing mahadras — a child already learning needs an equivalence, not a building.</p>
<p>If the ministry knows the places available in existing schools, its construction need will be lower than ours. Our figure is therefore an <b>upper bound</b>, deliberately.</p>

<h3>6. Limits</h3>
<p class="card warn" style="margin-top:8px">What these data <b>cannot</b> tell us:</p>
<ul>
<li>EPCV is a <b>sample</b>. Rates are estimates. In small wilayas the margin of error is wide: ±4.5 points for Inchiri (267 children surveyed) and ±4.1 for Tagant, against ±1.7 in Nouakchott. Rank differences between neighbouring wilayas should be read with care.</li>
<li>The extract used <b>carries no survey weights</b>. Rates are computed on the raw sample and may differ slightly from ANSADE's published figures.</li>
<li>Rates date from <b>2019</b> and are applied to the 2019 population. Nothing says they still hold today.</li>
<li>We measure whether a child <b>has ever attended</b> school, not whether they attend today nor what they learn there. A child enrolled but absent counts as schooled.</li>
<li>We measure <b>neither quality</b> of teaching, nor distance to school, nor the state of buildings, nor available teachers. A diagnosis is not a construction plan.</li>
<li>We <b>predict nothing</b>. EduFocus describes an observed situation and makes it comparable. It does not say what will happen if you invest.</li>
<li>The index weights (45/35/20) are a <b>choice</b>, not a result. A decision-maker favouring intensity would get another ranking — which is why the formula is shown.</li>
</ul>

<h3>7. Declaration on the use of artificial intelligence (Article 5)</h3>
<p class="card warn" style="margin-top:8px">The team used an AI assistant (Claude, Anthropic) during the hackathon. This use is declared in accordance with Article 5 of the rules.<br><br>
<b>Defined and decided by the team:</b> the choice of theme and research question; the decision to obtain EPCV 2019 from ANSADE, a base not included in the data supplied by the organisers; the definition of "out of formal school" and the decision to separate Quranic or mahadra teaching from the complete absence of instruction — the project's central idea; the index weights (45 / 35 / 20); the screen-by-screen specification of the application; the interpretation of results and the messages retained.<br><br>
<b>Produced with the assistant:</b> the Python analysis code (joining the two bases, computing the indicators, the index and the mechanisms); the HTML, CSS and JavaScript of the prototype; the writing of explanatory texts and their translation into Arabic and English; the generation of per-wilaya recommendations from rules agreed with the team; the automated test suite; the dashboard design and the redesign of the simulator into three allocation rules.<br><br>
<b>Verification:</b> every figure displayed was recomputed from the source data and checked against the team's submission document. The analysis scripts are provided with the project, so anyone can reproduce the whole calculation.</p>

<h3>8. Sources</h3>
<p class="src">1. Population by wilaya, 2013-2019. Base provided by the hackathon organisers — IndabaX Mauritania, 2026 Edition.<br><br>
2. Permanent Household Living Conditions Survey (EPCV 2019). National Agency for Statistics and Demographic and Economic Analysis (ANSADE), Islamic Republic of Mauritania. Extract used: 60,600 individuals, 13 wilayas. Obtained from ANSADE, the country's official producer of demographic and poverty statistics, available on request from the Agency.<br><br>
5. INEE minimum standards (Inter-Agency Network for Education in Emergencies): 40 pupils per teacher maximum at primary level. Used as the simulator's default assumption, editable by the user.<br><br>3. Base map: Natural Earth, admin-1 (public domain), simplified to 1.2 km.<br><br>
4. Open source resources used: Poppins and Nunito Sans fonts (SIL Open Font License 1.1), IBM Plex Sans Arabic and Amiri (SIL OFL 1.1). No external charting library: the map, rings and charts are written in SVG by the team.</p>

<h3>9. Technical note</h3>
<p class="src">The application reads a single source, <code>wilayas.csv</code> (13 rows). Every indicator — index, rank, priority level, mechanism, explanation — is computed upstream and stored in the file. The interface recomputes nothing, with one deliberate exception, documented in section 5: the simulator's allocation. No data is sent anywhere; the page works offline.</p>`,
